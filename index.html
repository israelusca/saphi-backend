<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F3EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Saphi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<title>Saphi · Cultiva con criterio</title>
<style>
:root{
  --brand-root:#163D34;--brand-leaf:#2D7358;--brand-leaf-soft:#E3EFE8;--brand-sun:#E7B13D;
  --brand-earth:#B75035;--brand-sky:#356A78;--brand-ink:#172A24;--brand-paper:#F4F3EC;
  --crema:var(--brand-paper);--crema-2:#EAEAE2;--ambar:var(--brand-sun);--ambar-osc:#855A00;
  --terracota:var(--brand-earth);--terracota-osc:#8F3B28;--tierra:var(--brand-root);--tierra-2:#3F574F;
  --verde:var(--brand-leaf);--verde-osc:#174E3B;--verde-bg:var(--brand-leaf-soft);--texto:var(--brand-ink);
  --tenue:#607169;--card:#FFFFFF;--linea:#D7DDD6;--linea-fuerte:#BBC7BF;--info:var(--brand-sky);
  --sombra:0 22px 58px rgba(22,61,52,.13);--sombra-sm:0 8px 24px rgba(22,61,52,.075);
  --font-ui:'Manrope',ui-sans-serif,system-ui,sans-serif;--font-botanical:'Source Serif 4',Georgia,serif;
  --ft:var(--font-ui);--fb:var(--font-ui);
}
*{box-sizing:border-box}
body{margin:0;background:#DDE3DD;color:var(--texto);font-family:var(--fb);font-size:16px;line-height:1.5;min-height:100vh;display:flex;justify-content:center;align-items:flex-start}
.app{width:100%;max-width:1120px;height:100vh;height:100dvh;background:var(--crema);position:relative;overflow:hidden;box-shadow:0 30px 90px rgba(24,62,52,.18);border:1px solid rgba(24,62,52,.08);display:flex;flex-direction:column}
@media(min-width:520px){.app{margin:18px 0;height:calc(100vh - 36px);height:calc(100dvh - 36px);border-radius:28px}}
.topbar{min-height:70px;padding:13px 18px;background:rgba(246,245,239,.97);border-bottom:1px solid rgba(24,62,52,.08);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:11px}
.brand-slot{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;background:var(--tierra);color:#fff;font-family:var(--font-botanical);font-size:22px;font-style:italic;font-weight:600}
.brand-copy{display:flex;flex-direction:column;line-height:1.05}
.bn{font-family:var(--ft);font-weight:700;font-size:21px;color:var(--tierra)}
.brand-caption{margin-top:4px;font-size:9px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--tenue)}
.tb-right{display:flex;align-items:center;gap:7px}
.iconbtn{width:42px;height:42px;border-radius:13px;background:#fff;border:1px solid var(--linea);color:var(--tierra);cursor:pointer;font-size:16px}
.content{flex:1;overflow-y:auto;padding:12px 18px 118px;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.nav{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:min(680px,calc(100% - 20px));background:rgba(255,255,255,.97);border:1px solid var(--linea);border-radius:20px;display:flex;padding:6px;gap:3px;box-shadow:0 14px 40px rgba(24,62,52,.17);z-index:20;backdrop-filter:blur(18px)}
.nav button{flex:1;min-height:54px;border:0;border-radius:15px;background:transparent;color:var(--tenue);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:800;cursor:pointer}
.nav button.on{background:var(--verde-bg);color:var(--verde-osc)}
.fab{position:absolute;right:22px;bottom:84px;width:58px;height:58px;border-radius:18px;background:var(--terracota);color:#fff;border:none;font-size:29px;box-shadow:0 14px 28px rgba(146,59,39,.28);cursor:pointer;z-index:21}
.home-shell,.collection-shell,.add-shell,.agenda-shell,.tools-shell{max-width:980px;margin:0 auto}
.home-hero{position:relative;overflow:hidden;margin-top:10px;padding:26px 24px;border-radius:26px;color:#fff;background:var(--brand-root)}
.hh-hi{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#D6E8DF}
.hh-big{margin:15px 0 8px;font-size:32px;letter-spacing:-1px}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.hstat{padding:15px 12px;background:#fff;border:1px solid var(--linea);border-radius:18px;cursor:pointer;color:var(--tierra)}
.hstat .hs-n{font-size:28px;font-weight:800;display:block;margin-top:5px}
.hstat .hs-l{font-size:12px;color:var(--tenue)}
.btn-primary{width:100%;min-height:50px;background:var(--ambar);color:#2F250C;border:none;font-weight:800;font-size:15px;border-radius:15px;cursor:pointer}
.collection-empty{padding:36px 20px;background:#fff;border:1px dashed var(--linea-fuerte);border-radius:26px;text-align:center;margin-top:20px}
.empty-mark{width:52px;height:52px;margin:0 auto 13px;display:grid;place-items:center;border-radius:16px;background:var(--verde-bg);color:var(--verde-osc);font-size:22px}
.toast{position:fixed;bottom:102px;left:50%;transform:translateX(-50%);background:var(--tierra);color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <span class="brand-slot" aria-hidden="true">S</span>
      <span class="brand-copy"><span class="bn">Saphi</span><span class="brand-caption">Cultiva con criterio</span></span>
    </div>
    <div class="tb-right">
      <button class="iconbtn" onclick="toggleSol()" title="Modo sol">☀️</button>
    </div>
  </div>

  <main class="content" id="content"></main>

  <button class="fab" onclick="goAdd()" aria-label="Agregar planta">+</button>

  <nav class="nav">
    <button id="nav-inicio" onclick="goHome()"><span>Inicio</span></button>
    <button id="nav-plantas" onclick="goList()"><span>Colección</span></button>
    <button id="nav-cal" onclick="goCalendar()"><span>Agenda</span></button>
    <button id="nav-tools" onclick="openTools()"><span>Herramientas</span></button>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script>
const TYPES={
 t1:{tag:'🌵 T1',badge:'🌵 T1 · Cactus y suculentas de sol'},
 t2:{tag:'🌺 T2',badge:'🌺 T2 · Sombra y epífitas de selva'},
 t3:{tag:'🪰 T3',badge:'🪰 T3 · Plantas carnívoras'},
 t4:{tag:'🌿 T4',badge:'🌿 T4 · Tropicales de follaje'},
 t5:{tag:'🪴 T5',badge:'🪴 T5 · Resistentes de interior'},
 t6:{tag:'🌸 T6',badge:'🌸 T6 · Exterior y arbustos de flor'},
 t7:{tag:'🥬 T7',badge:'🥬 T7 · Aromáticas, hortalizas y frutales'},
 t8:{tag:'🌬️ T8',badge:'🌬️ T8 · Aéreas y musgos'}
};

const SPECIES=[
 {id:'sanpedro',t:'t1',n:'San Pedro',sci:'Trichocereus pachanoi',nota:'Cactus columnar; sol y poco riego.'},
 {id:'sabila',t:'t1',n:'Sábila',sci:'Aloe vera',nota:'Suculenta medicinal; buen drenaje.'},
 {id:'monstera',t:'t4',n:'Monstera',sci:'Monstera deliciosa',nota:'Luz indirecta brillante; tutor de musgo.'},
 {id:'poto',t:'t4',n:'Poto',sci:'Epipremnum aureum',nota:'Muy resistente; luz indirecta.'},
 {id:'albahaca',t:'t7',n:'Albahaca',sci:'Ocimum basilicum',nota:'Sol directo y riego constante.'},
 {id:'menta',t:'t7',n:'Menta',sci:'Mentha sp.',nota:'Invasora; tener en maceta aparte.'},
 {id:'durazno',t:'t7',n:'Durazno / Melocotón',sci:'Prunus persica',nota:'Frutal de clima templado; sol y poda anual.'},
 {id:'manzana',t:'t7',n:'Manzana',sci:'Malus domestica',nota:'Frutal de Sierra; requiere horas de frío.'},
 {id:'tomate',t:'t7',n:'Tomate',sci:'Solanum lycopersicum',nota:'Tutor + P-K en floración.'},
 {id:'papa',t:'t7',n:'Papa',sci:'Solanum tuberosum',nota:'Tubérculo andino; aporca al crecer.'}
];
  let plants = JSON.parse(localStorage.getItem('saphi_plants_v2')) || [
  {id:'ex1', speciesId:'sanpedro', name:'San Pedro de prueba', potSize:10, date:new Date().toISOString()}
];
const content = document.getElementById('content');

function savePlants() {
  localStorage.setItem('saphi_plants_v2', JSON.stringify(plants));
}

function updateNav(activeId) {
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('on'));
  const el = document.getElementById(activeId);
  if(el) el.classList.add('on');
}

function goHome() {
  content.innerHTML = `
    <div class="home-shell">
      <div class="home-hero">
        <span class="hh-hi">¡HOLA, CULTIVADOR!</span>
        <h2 class="hh-big">Tu cultivo al día</h2>
        <div>Panel general y estado de tus plantas</div>
      </div>
      <div class="hstats">
        <div class="hstat" onclick="goList()">
          <span>TOTAL</span>
          <span class="hs-n">${plants.length}</span>
          <span class="hs-l">Plantas registradas</span>
        </div>
      </div>
      <button class="btn-primary" onclick="goAdd()">+ Agregar nueva planta</button>
    </div>`;
  updateNav('nav-inicio');
}

function goList() {
  let html = '';
  if(plants.length === 0) {
    html = `
      <div class="collection-empty">
        <div class="empty-mark">🌿</div>
        <h3>Tu colección está vacía</h3>
        <p>Agrega tu primera planta para recibir recomendaciones.</p>
        <button class="btn-primary" style="margin-top:12px;" onclick="goAdd()">Agregar planta</button>
      </div>`;
  } else {
    plants.forEach(p => {
      const sp = SPECIES.find(s => s.id === p.speciesId) || SPECIES[0];
      html += `
        <div style="background:#fff;padding:14px;border-radius:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--sombra-sm);">
          <div>
            <div style="font-weight:800;color:var(--tierra);font-size:16px;">${p.name}</div>
            <div style="font-size:12px;color:var(--tenue);">${sp.n} · Maceta ${p.potSize}L</div>
          </div>
          <button onclick="deletePlant('${p.id}')" style="background:#FBE3D6;color:var(--terracota);border:none;padding:6px 10px;border-radius:8px;font-weight:800;cursor:pointer;">Eliminar</button>
        </div>`;
    });
  }
  content.innerHTML = `<div><h2>Mis Plantas</h2><div style="margin-top:10px;">${html}</div></div>`;
  updateNav('nav-plantas');
}

function goCalendar() {
  content.innerHTML = `<div><h2>Agenda de Cuidados</h2><p>Tareas de riego y control lunar al día.</p></div>`;
  updateNav('nav-cal');
}

function openTools() {
  content.innerHTML = `<div><h2>Herramientas</h2><p>Calculadoras y utilidades agronómicas para tu growshop.</p></div>`;
  updateNav('nav-tools');
}

function goAdd() {
  let opts = '';
  SPECIES.forEach(s => {
    opts += `<option value="${s.id}">${s.n} (${s.sci})</option>`;
  });

  content.innerHTML = `
    <div>
      <h2>Agregar Planta</h2>
      <div style="margin-top:14px;">
        <label style="font-weight:800;display:block;margin-bottom:6px;">Nombre personalizado</label>
        <input type="text" id="pName" placeholder="Ej. Mi San Pedro del patio" style="width:100%;padding:12px;border:1px solid #ccc;border-radius:12px;font-size:16px;outline:none;">
        
        <label style="font-weight:800;display:block;margin:14px 0 6px;">Especie</label>
        <select id="pSpecies" style="width:100%;padding:12px;border:1px solid #ccc;border-radius:12px;font-size:16px;background:#fff;outline:none;">${opts}</select>

        <label style="font-weight:800;display:block;margin:14px 0 6px;">Tamaño de maceta (Litros)</label>
        <input type="number" id="pPot" value="5" min="0.5" step="0.5" style="width:100%;padding:12px;border:1px solid #ccc;border-radius:12px;font-size:16px;outline:none;">
        
        <button class="btn-primary" style="margin-top:20px;" onclick="savePlant()">Guardar en el dispositivo</button>
        <button onclick="goList()" style="width:100%;margin-top:10px;padding:12px;background:none;border:none;color:#666;font-weight:800;cursor:pointer;">Cancelar</button>
      </div>
    </div>`;
}

function savePlant() {
  const name = document.getElementById('pName').value.trim() || 'Planta nueva';
  const speciesId = document.getElementById('pSpecies').value;
  const potSize = parseFloat(document.getElementById('pPot').value) || 3;
  
  plants.push({
    id: 'p_' + Date.now(),
    speciesId: speciesId,
    name: name,
    potSize: potSize,
    date: new Date().toISOString()
  });
  
  savePlants();
  showToast("¡Planta guardada con éxito!");
  goList();
}

function deletePlant(id) {
  if(confirm("¿Eliminar esta planta?")) {
    plants = plants.filter(p => p.id !== id);
    savePlants();
    showToast("Planta eliminada");
    goList();
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function toggleSol() {
  document.querySelector('.app').classList.toggle('sol');
}

goHome();
</script>
</body>
</html>
