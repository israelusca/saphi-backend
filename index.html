.plant-section{scroll-margin-top:66px}
.plant-section-label{display:flex;align-items:center;gap:9px;margin:24px 2px 10px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--tenue)}
.plant-section-label::before{content:'';width:22px;height:2px;background:var(--brand-sun);border-radius:99px}
.statuscard{padding:16px;border-radius:19px}
.st-line{font-size:14px}
.st-grid>div{padding:11px;border-radius:13px}
.st-k{font-size:11px}
.st-v{font-size:14px}
.st-btns button{min-height:44px;border-radius:13px;font-size:13px}
.toolbar{gap:8px;margin:12px 0 4px}
.tbtn{min-height:62px;border-radius:15px;font-size:12px;box-shadow:none}
.tbtn .tb-e{font-size:18px}
.tbtn.share-action{background:var(--brand-earth);border-color:var(--brand-earth);color:#fff}
.tbtn.share-action .tb-e{filter:grayscale(1) brightness(4)}
.statuscard{border-left:4px solid var(--brand-sky)}
.statuscard .st-title{color:var(--tierra);font-size:15px}
.st-btns button:first-child{background:var(--brand-root);border-color:var(--brand-root);color:#fff}
.st-btns button.done{background:var(--verde-bg);border-color:var(--verde);color:var(--verde-osc)}
.care-rule{display:flex;align-items:flex-start;gap:10px;margin:0 0 12px;padding:12px 14px;border-radius:14px;background:#EEF3F1;color:var(--tierra-2);font-size:13px;line-height:1.45}
.care-rule strong{color:var(--tierra)}
.more-item{min-height:58px;border-radius:15px;font-size:14px;box-shadow:none}
.more-item span{font-size:12px}
.moon-hero,.growth,.reto{background:var(--tierra);background-image:none}
.growth{color:#fff;border-color:var(--tierra)}
.growth-big,.growth-sub{color:#fff}

/* Navegación inferior y acciones */
.nav{
  left:50%;
  right:auto;
  width:min(680px,calc(100% - 20px));
  transform:translateX(-50%);
  bottom:10px;
  padding:6px;
  padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));
  justify-content:stretch;
  gap:3px;
  background:rgba(255,255,255,.97);
  border:1px solid var(--linea);
  border-radius:20px;
  box-shadow:0 14px 40px rgba(24,62,52,.17);
  backdrop-filter:blur(18px);
}
.nav button{
  flex:1;
  min-width:0;
  min-height:54px;
  border:0;
  border-radius:15px;
  background:transparent;
  color:var(--tenue);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  font-family:var(--fb);
  font-size:11px;
  font-weight:800;
  cursor:pointer;
}
.nav button.on{background:var(--verde-bg);color:var(--verde-osc)}
.nav button.on::after{content:'';width:16px;height:2px;margin-top:1px;border-radius:99px;background:currentColor}
.nav button .ic{
  width:22px;
  height:22px;
  display:grid;
  place-items:center;
  line-height:1;
}
.nav button .ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on .ic{transform:none}
.fab{
  right:22px;
  bottom:84px;
  width:58px;
  height:58px;
  border-radius:18px;
  background:var(--terracota);
  background-image:none;
  box-shadow:0 14px 28px rgba(146,59,39,.28);
  font-family:var(--ft);
  font-size:29px;
}
.fab:hover{transform:translateY(-2px)}
.menu{
  top:66px;
  right:14px;
  width:min(340px,calc(100% - 28px));
  padding:8px;
  border:1px solid rgba(24,62,52,.12);
  border-radius:22px 22px 22px 8px;
  background:#F8F8F3;
  box-shadow:0 22px 60px rgba(24,62,52,.2);
}
.menu-head{padding:10px 11px 9px;border-bottom:1px solid var(--linea);margin-bottom:5px}
.menu-head small{display:block;color:var(--verde-osc);font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
.menu-head strong{display:block;margin-top:3px;color:var(--tierra);font-family:var(--ft);font-size:15px}
.menu button{display:grid;grid-template-columns:38px 1fr;align-items:center;gap:10px;min-height:54px;border-radius:14px;padding:8px 10px;font-size:14px;white-space:normal}
.menu button .menu-ic{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:#fff;border:1px solid var(--linea);font-size:17px}
.menu button .menu-copy{display:flex;flex-direction:column;gap:2px}
.menu button .menu-copy b{font-size:13px;color:var(--tierra)}
.menu button .menu-copy small{font-size:11px;line-height:1.3;color:var(--tenue);font-weight:650}
.menu button:hover{background:var(--verde-bg);color:var(--verde-osc)}
.menu button:hover .menu-ic{border-color:#BFD6C8}
.menu-trigger{display:grid;place-items:center;background:var(--tierra);color:#fff;border-color:var(--tierra);padding:0;overflow:hidden}
.menu-trigger:hover{background:var(--verde-osc);border-color:var(--verde-osc)}
.menu-dots{width:22px;height:6px;display:flex;align-items:center;justify-content:space-between;letter-spacing:0;transform:none;font-size:0;line-height:0}
.menu-dots::before,.menu-dots::after,.menu-dots i{content:'';width:5px;height:5px;border-radius:50%;background:#fff;display:block}
.toast{
  bottom:102px;
  max-width:calc(100% - 32px);
  padding:12px 16px;
  border-radius:14px;
  background:var(--tierra);
  font-size:14px;
}

/* Colección V3 */
.collection-shell{max-width:980px;margin:0 auto}
.collection-head{position:relative;overflow:hidden;margin:8px 0 14px;padding:22px 22px 20px;border-radius:var(--radio-lg) var(--radio-lg) var(--radio-lg) 9px;background:#fff;border:1px solid var(--linea)}
.collection-head::after{content:'';position:absolute;right:-52px;top:-72px;width:180px;height:180px;border:1px solid #D6E3DA;border-radius:50%;box-shadow:0 0 0 24px #F3F7F4,0 0 0 49px #FAFBF9}
.collection-kicker{position:relative;z-index:1;font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--verde)}
.collection-title-row{position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-top:10px}
.collection-title-row h2{margin:0;font-size:clamp(27px,4vw,38px);line-height:1.05;letter-spacing:-1px;color:var(--tierra)}
.collection-count{flex:0 0 auto;padding:7px 10px;border-radius:11px;background:var(--verde-bg);color:var(--verde-osc);font-size:12px;font-weight:800}
.collection-copy{position:relative;z-index:1;max-width:600px;margin:9px 0 0;color:var(--tenue);font-size:14px;line-height:1.5}
.collection-controls{margin-bottom:14px;padding:12px;background:#fff;border:1px solid var(--linea);border-radius:var(--radio-md)}
.collection-controls .searchbar{margin:0 0 10px}
.collection-controls .filters{margin:0}
.collection-view{display:flex;justify-content:flex-end;margin:0 0 9px}
.collection-shell .plant-card{background:#fff;border-left:0}
.collection-shell .plant-card::before{width:4px}
.collection-shell .pc-sci{font-family:var(--font-botanical);font-size:14px}
.pc-state{flex:0 0 auto;max-width:120px;padding:7px 9px;border-radius:11px;background:#EFF4F1;color:var(--verde-osc);font-size:11px;font-weight:800;line-height:1.25;text-align:center}
.pc-state.warn{background:#FFF0E9;color:var(--terracota-osc)}
.collection-shell .gt-info{display:flex;flex-direction:column;gap:5px}
.gt-state{font-size:12px;font-weight:800;color:var(--verde-osc)}
.gt-state.warn{color:var(--terracota-osc)}
.collection-empty{padding:36px 20px;background:#fff;border:1px dashed var(--linea-fuerte);border-radius:var(--radio-lg);text-align:center}
.collection-empty .empty-mark{width:52px;height:52px;margin:0 auto 13px;display:grid;place-items:center;border-radius:16px 16px 16px 5px;background:var(--verde-bg);color:var(--verde-osc);font-size:22px}
.collection-empty h3{margin:0;color:var(--tierra);font-size:19px}
.collection-empty p{max-width:380px;margin:7px auto 17px;color:var(--tenue);font-size:14px;line-height:1.5}
.collection-empty button{min-height:48px;padding:11px 18px;border:0;border-radius:14px;background:var(--tierra);color:#fff;font-weight:800;cursor:pointer}

/* Registro guiado V3 */
.add-shell{max-width:820px;margin:0 auto}
.add-head{margin:7px 0 15px;padding:18px 19px;border-radius:var(--radio-lg) var(--radio-lg) var(--radio-lg) 9px;background:var(--brand-root);color:#fff}
.add-kicker{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#CAE0D6}
.add-head h2{margin:9px 0 4px;font-size:clamp(25px,4vw,34px);line-height:1.08;letter-spacing:-.8px}
.add-head p{max-width:620px;margin:0;color:#D7E7E0;font-size:14px;line-height:1.5}
.add-progress{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:0 0 13px;padding:5px;background:#E7E8E1;border-radius:16px}
.add-step{position:relative;min-height:48px;display:flex;align-items:center;justify-content:center;gap:7px;padding:8px;border-radius:12px;color:var(--tenue);font-size:12px;font-weight:800}
.add-step span{width:22px;height:22px;display:grid;place-items:center;border:1px solid #BCC6BF;border-radius:8px;font-size:10px}
.add-step.on{background:#fff;color:var(--tierra);box-shadow:0 3px 10px rgba(22,61,52,.08)}
.add-step.on span{background:var(--brand-sun);border-color:var(--brand-sun);color:#2F250C}
.add-step.done{color:var(--verde-osc)}
.step-panel{padding:19px;background:#fff;border:1px solid var(--linea);border-radius:var(--radio-lg)}
.step-title{margin:0 0 5px;color:var(--tierra);font-size:20px;letter-spacing:-.35px}
.step-copy{margin:0 0 20px;color:var(--tenue);font-size:14px;line-height:1.5}
.catalogue-note{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-6px 0 12px;padding:10px 12px;border-radius:13px;background:var(--verde-bg);color:var(--verde-osc);font-size:12px;font-weight:700}
.catalogue-note b{font-size:13px}
.quick-searches{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0 13px}
.quick-searches button{min-height:36px;padding:7px 10px;border:1px solid var(--linea);border-radius:11px;background:#fff;color:var(--tierra-2);font-size:12px;font-weight:800;cursor:pointer}
.quick-searches button:hover{border-color:var(--verde);background:var(--verde-bg);color:var(--verde-osc)}
.identify-ai{margin:13px 0 17px;padding:14px;border:1px solid #C8D7D0;border-radius:16px;background:#F2F7F4}
.identify-ai-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.identify-ai-head strong{display:block;color:var(--tierra);font-size:14px}
.identify-ai-head span{display:block;margin-top:3px;color:var(--tenue);font-size:12px;line-height:1.4}
.ai-quota{flex:0 0 auto;padding:5px 8px;border-radius:9px;background:#fff;color:var(--verde-osc)!important;font-size:11px!important;font-weight:800}
.identify-ai-upload{min-height:58px;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:11px;padding:10px 14px;border:1px solid var(--verde);border-radius:13px;background:var(--brand-root);color:#fff;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 10px 20px rgba(20,73,56,.16)}
.identify-ai-upload:hover{filter:brightness(1.06);transform:translateY(-1px)}
.identify-ai-upload .upload-ic{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:rgba(255,255,255,.16);font-size:18px;flex:0 0 auto}
.identify-ai-upload .upload-copy{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.identify-ai-upload .upload-copy b{display:block;color:#fff;font-size:14px}
.identify-ai-upload .upload-copy small{display:block;margin-top:3px;color:rgba(255,255,255,.78);font-size:11px;font-weight:700}
.identify-preview{height:150px;margin-top:11px;border-radius:14px;background:#DDE6E1 center/cover no-repeat}
.identify-result{margin-top:10px}
.identify-match{padding:12px;border:1px solid #BED5C6;border-radius:14px;background:#fff}
.identify-match-k{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--verde)}
.identify-match-n{margin-top:4px;color:var(--tierra);font-size:16px;font-weight:800}
.identify-match-s{font-family:var(--font-botanical);font-style:italic;color:var(--tenue);font-size:14px}
.identify-match button{width:100%;min-height:42px;margin-top:10px;border:0;border-radius:12px;background:var(--brand-sun);color:#30250A;font-size:12px;font-weight:800;cursor:pointer}
.identify-warning{padding:11px;border-radius:12px;background:#FFF0E9;color:var(--terracota-osc);font-size:12px;line-height:1.5}
.step-panel .field:last-child{margin-bottom:0}
.step-panel .results{max-height:320px;overflow:auto;border-radius:14px;scrollbar-width:thin}
.step-panel .res{min-height:58px;padding:10px 11px;border-radius:12px}
.res-main{min-width:0;flex:1}
.res-origin{display:inline-block;margin-top:4px;padding:2px 7px;border-radius:7px;background:var(--verde-bg);color:var(--verde-osc);font-size:10px;font-weight:800}
.chosen-origin{display:block;margin-top:3px;color:var(--verde-osc);font-size:11px;font-weight:800}
.form-actions{display:flex;align-items:center;gap:9px;margin-top:13px}
.form-actions .btn-primary{flex:1;margin:0}
.form-actions .btn-ghost{width:auto;min-width:108px;margin:0;padding:13px 16px}
.form-back{min-width:48px;height:50px;border:1px solid var(--linea);border-radius:14px;background:#fff;color:var(--tierra);font-size:20px;font-weight:800;cursor:pointer}
.form-cancel{display:block;width:100%;margin-top:10px;padding:9px;border:0;background:transparent;color:var(--tenue);font-size:13px;font-weight:700;cursor:pointer}
.step-summary{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:18px}
.step-summary>div{padding:12px;border:1px solid var(--linea);border-radius:14px;background:#FAFBF9}
.step-summary small{display:block;color:var(--tenue);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.step-summary strong{display:block;margin-top:4px;color:var(--tierra);font-size:14px}

/* Agenda V3 · primero decisiones, después calendario */
.agenda-shell{max-width:920px;margin:0 auto}
.agenda-head{margin:7px 0 13px;padding:20px;border-radius:var(--radio-lg) var(--radio-lg) var(--radio-lg) 9px;background:var(--brand-root);color:#fff}
.agenda-kicker{font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#C9DED5}
.agenda-head h2{margin:7px 0 5px;color:#fff;font-size:clamp(25px,4vw,34px);line-height:1.1;letter-spacing:-.75px}
.agenda-head p{max-width:650px;margin:0;color:#D5E5DE;font-size:14px;line-height:1.5}
.agenda-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:16px}
.agenda-stat{min-height:67px;padding:10px 11px;border:1px solid rgba(255,255,255,.16);border-radius:14px;background:rgba(255,255,255,.08)}
.agenda-stat strong{display:block;color:#fff;font-size:22px;line-height:1}
.agenda-stat span{display:block;margin-top:5px;color:#D4E5DE;font-size:11px;font-weight:750;line-height:1.25}
.agenda-stat.warn{background:rgba(231,178,63,.17);border-color:rgba(244,217,144,.35)}
.agenda-stat.warn strong{color:#F4D990}
.agenda-toolbar{display:flex;align-items:center;gap:8px;margin:0 0 13px}
.agenda-add{flex:1;min-height:48px;border:0;border-radius:14px;background:var(--brand-sun);color:#31270D;font-size:14px;font-weight:850;cursor:pointer}
.agenda-notif{min-width:48px;min-height:48px;padding:0 13px;border:1px solid var(--linea-fuerte);border-radius:14px;background:#fff;color:var(--tierra);font-size:13px;font-weight:800;cursor:pointer}
.agenda-notif.on{border-color:#BCD6C6;background:var(--verde-bg);color:var(--verde-osc)}
.reminder-form{margin:0 0 14px;padding:15px;border:1px solid #C8D7D0;border-radius:18px;background:#F2F7F4}
.reminder-form h3{margin:0 0 12px;color:var(--tierra);font-size:16px}
.reminder-form-grid{display:grid;grid-template-columns:1.35fr .8fr;gap:9px}
.reminder-form label{display:block;color:var(--tierra-2);font-size:12px;font-weight:800}
.reminder-form input,.reminder-form select{width:100%;min-height:45px;margin-top:5px;padding:9px 11px;border:1px solid var(--linea-fuerte);border-radius:12px;background:#fff;color:var(--texto);font-size:14px;outline:none}
.reminder-form-actions{display:flex;gap:8px;margin-top:10px}
.reminder-form-actions button{min-height:44px;padding:9px 13px;border-radius:12px;font-size:13px;font-weight:800;cursor:pointer}
.reminder-form-actions .save{flex:1;border:0;background:var(--tierra);color:#fff}
.reminder-form-actions .cancel{border:1px solid var(--linea);background:#fff;color:var(--tenue)}
.agenda-weather{display:flex;align-items:flex-start;gap:10px;margin:0 0 13px;padding:11px 12px;border:1px solid #C7D9EB;border-radius:14px;background:#EDF4FA;color:#2F5B8A;font-size:13px;line-height:1.45}
.agenda-weather b{display:block;color:#274F79}
.agenda-week{margin:0 0 14px;padding:11px;border:1px solid var(--linea);border-radius:18px;background:#fff}
.agenda-week .wknav{margin:0 0 9px}
.agenda-week .wk{margin:0}
.agenda-week .d{position:relative;min-height:71px;padding-bottom:7px}
.day-count{position:absolute;right:4px;top:4px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px;border-radius:999px;background:var(--tierra);color:#fff;font-size:9px;font-weight:850}
.agenda-day-title{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:18px 2px 9px}
.agenda-day-title h3{margin:0;color:var(--tierra);font-size:18px;letter-spacing:-.3px}
.agenda-day-title span{color:var(--tenue);font-size:12px;font-weight:750}
.agenda-section{margin-top:16px}
.agenda-section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 8px}
.agenda-section-head h3{margin:0;color:var(--tierra);font-size:14px}
.agenda-section-head span{color:var(--tenue);font-size:11px;font-weight:800}
.agenda-item{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:11px;align-items:center;margin-bottom:8px;padding:12px;border:1px solid var(--linea);border-radius:16px;background:#fff;box-shadow:var(--sombra-sm)}
.agenda-item.priority{border-color:#E8B9A8;background:#FFF9F6}
.agenda-item.review{border-color:#E7D5A4;background:#FFFCF3}
.agenda-item.done{opacity:.72;background:#F4F7F4;box-shadow:none}
.agenda-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:var(--verde-bg);font-size:18px}
.agenda-item.priority .agenda-icon{background:#FBE3D6}
.agenda-item.review .agenda-icon{background:#FBEFCD}
.agenda-copy{min-width:0}
.agenda-type{display:flex;align-items:center;gap:6px;margin-bottom:2px;color:var(--tenue);font-size:10px;font-weight:850;letter-spacing:.07em;text-transform:uppercase}
.agenda-name{color:var(--tierra);font-size:14px;font-weight:850;line-height:1.3}
.agenda-reason{margin-top:3px;color:var(--tenue);font-size:12px;line-height:1.4}
.agenda-action{min-height:39px;padding:8px 10px;border:1px solid var(--linea-fuerte);border-radius:11px;background:#fff;color:var(--tierra);font-size:11px;font-weight:850;cursor:pointer;white-space:nowrap}
.agenda-item.priority .agenda-action{border-color:var(--terracota);color:var(--terracota-osc)}
.agenda-item.done .agenda-action{border:0;background:var(--verde-bg);color:var(--verde-osc)}
.agenda-empty{padding:27px 18px;border:1px dashed var(--linea-fuerte);border-radius:18px;background:#FAFBF9;text-align:center}
.agenda-empty strong{display:block;color:var(--tierra);font-size:16px}
.agenda-empty p{max-width:430px;margin:5px auto 0;color:var(--tenue);font-size:13px;line-height:1.5}
.agenda-secondary{margin-top:18px}
.agenda-secondary .calsec{box-shadow:none}
.custom-delete{margin-left:6px;border:0;background:none;color:var(--tenue);font-size:11px;text-decoration:underline;cursor:pointer}
.mcell{position:relative}
.mcell .task-dot{position:absolute;right:5px;bottom:5px;width:7px;height:7px;border-radius:50%;background:var(--terracota)}
.delete-zone{margin-top:22px;padding:15px;border:1px solid #E7C7BC;border-radius:18px;background:#FFF9F6}
.delete-zone strong{display:block;color:var(--terracota-osc);font-size:14px}
.delete-zone p{margin:4px 0 11px;color:var(--tenue);font-size:12px;line-height:1.45}
.delete-zone button{width:100%;min-height:46px;border:1px solid #D99D89;border-radius:13px;background:#fff;color:var(--terracota-osc);font-size:13px;font-weight:850;cursor:pointer}

.prop-status-card{margin-top:14px;padding:15px;border:1px solid #BFD6C8;border-radius:19px;background:#F4F9F6}

/* Estudio social y celebraciones */

.shop-shell{max-width:980px;margin:0 auto}

.shop-diagnosis{display:grid;grid-template-columns:42px minmax(0,1fr);gap:11px;align-items:start;margin:13px 0;padding:14px;border-radius:17px;background:#EEF4F1;border-left:4px solid var(--verde)}

.shop-diagnosis span{display:block;margin-top:3px;color:var(--tierra-2);font-size:12px;line-height:1.45}

function shopRecommendationData(p,forced){
  if(!p)return {title:'Elige una planta para recomendar con contexto',copy:'Saphi necesita conocer la especie y su momento de cuidado antes de sugerir una compra.',items:[]};
  const s=sp(p.esp),pi=propagationInfo(p),tr=pi?{aplica:false,due:false}:trasplanteInfo(p,s),lz=pi?null:luzInfo(p,s),items=[];
  const add=(id,why,need,rank)=>items.push({id:id,why:why,need:need,rank:rank||'Recomendado'}),mixId='mix_'+s.t;
  if(forced==='trasplante'){add(mixId,'Renovar el medio tiene sentido cuando el sustrato perdió estructura o la raíz ocupó el contenedor.','trasplante','Primero');add(s.t==='t2'?'orchid_pot':'drain_pot','El nuevo contenedor debe resolver drenaje y espacio, no ser solo más grande.','trasplante','Complemento');}
  else if(forced==='sustrato'){add(mixId,'La mezcla está alineada con la aireación y retención que requiere este grupo de plantas.','sustrato','Principal');if(s.t!=='t8')add('ph_ec_meter','Solo aporta valor si vas a comparar mezclas o ajustar una solución con datos.','sustrato','Para medir');}
  else if(forced==='propagar'){add(pi&&p.propagation.method==='agua'?'prop_water':'prop_medium','El medio debe facilitar el control de humedad, oxígeno y limpieza durante el enraizamiento.','propagar','Principal');add('clean_shears','Un corte limpio y una herramienta desinfectable reducen daño innecesario.','propagar','Complemento');}
  else if(forced==='soporte'){add('moss_pole','Las trepadoras responden mejor a un soporte estable colocado antes de que los tallos se doblen.','soporte','Principal');}
  else if(forced==='medir'){add('light_meter','Medir permite comparar ubicaciones antes de gastar en iluminación o mover la planta a ciegas.','medir','Primero medir');if(isTech())add('ph_ec_meter','Aporta seguimiento útil cuando registras pH y CE de forma consistente.','medir','Campo');}
  else if(forced==='plaga'){add('sticky_traps','El monitoreo ayuda a confirmar presencia y tendencia de insectos voladores antes de tratar.','plaga','Monitoreo');}
  else if(pi){add(p.propagation.method==='agua'?'prop_water':'prop_medium','Este lote está en enraizamiento y necesita un medio fácil de revisar y mantener limpio.','propagar','Necesidad activa');add('clean_shears','Sirve para retirar tejido dañado con un corte limpio y desinfectable.','propagar','Complemento');}
  else if(tr.aplica&&tr.due){add(mixId,'La ficha señala que ya corresponde evaluar trasplante; primero confirma raíces apretadas o sustrato degradado.','trasplante','Necesidad detectada');add(s.t==='t2'?'orchid_pot':'drain_pot','Si trasplantas, el contenedor debe mejorar drenaje sin sobredimensionarse.','trasplante','Complemento');}
  else if(lz&&lz.status!=='ok'&&lz.status!=='unknown'){add('light_meter','La ubicación no coincide con la luz esperada; medir ayuda a probar otro sitio antes de comprar iluminación.','medir','Primero medir');}
  else if(s.t==='t2'&&p.potSince&&monthsBetween(pd(p.potSince),new Date())>=18){add('mix_t2','Las epífitas necesitan revisar la estructura de la corteza cuando envejece y se compacta.','sustrato','Revisar');add('orchid_pot','Útil solo si las raíces ya ocupan el contenedor o falta ventilación.','trasplante','Condicional');}
  return {title:items.length?'Una necesidad, una solución razonada':'No detectamos una compra urgente',copy:items.length?'La recomendación parte del estado de '+p.nombre+'. Verifica la condición indicada antes de comprar.':'Los cuidados registrados no justifican comprar algo ahora. Puedes declarar una necesidad concreta si estás resolviendo otro problema.',items:items};
}

function lineageOrder(arr){
  const ids=new Set(arr.map(p=>p.id)),children={},out=[],seen=new Set();
  arr.forEach(p=>{if(p.parentId&&ids.has(p.parentId)){if(!children[p.parentId])children[p.parentId]=[];children[p.parentId].push(p);}});
  function walk(p){if(!p||seen.has(p.id))return;seen.add(p.id);out.push(p);(children[p.id]||[]).forEach(walk);}
  arr.filter(p=>!p.parentId||!ids.has(p.parentId)).forEach(walk);arr.forEach(walk);return out;
}

  const idx=Math.floor(frac*8+0.5)%8;
  const names=['Luna nueva','Luna creciente','Cuarto creciente','Gibosa creciente','Luna llena','Gibosa menguante','Cuarto menguante','Luna menguante'];

function moonLon(d){const j2000=Date.UTC(2000,0,1,12)/86400000;const D=(d.getTime()/86400000)-j2000;let L=218.316+13.176396*D,M=134.963+13.064993*D;let lon=L+6.289*Math.sin(M*Math.PI/180);return((lon%360)+360)%360;}

function pd(iso){if(!iso)return new Date();const a=(''+iso).split('-');return new Date(+a[0],(+a[1]||1)-1,+a[2]||1,12,0,0);}

function streakCount(){let s;try{s=new Set(JSON.parse(localStorage.getItem('saphi_actions'))||[]);}catch(e){return 0;}let cur=new Date();cur.setHours(12,0,0,0);if(!s.has(isoLocal(cur))){cur.setDate(cur.getDate()-1);if(!s.has(isoLocal(cur)))return 0;}let n=0;while(s.has(isoLocal(cur))){n++;cur.setDate(cur.getDate()-1);}return n;}

// ---------- trasplante ----------
function monthsBetween(a,b){return (b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth())-(b.getDate()<a.getDate()?1:0);}
function trasplanteInfo(p,s){const iv=TRASPLANTE[s.t];if(!iv||p.pot==='tierra')return{aplica:false};
  const baseISO=p.lastRepot||p.potSince;const known=!!baseISO;const base=known?pd(baseISO):new Date(p.id);
  const m=Math.max(0,monthsBetween(base,new Date()));const left=iv-m;const cerca=Math.max(2,Math.round(iv*0.2));
  const lleva=known?('Lleva ~'+fmtDur(m)+' en esta maceta'):('Sin fecha registrada (estimando desde que la agregaste)');
  const cada=(TFRASE[s.t]||'a esta planta')+' les toca cada ~'+fmtDur(iv);
  let estado,due=false,when;
  if(left<=0){due=true;estado='ya le toca 🪴';when='Ahora';}
  else if(left<=cerca){estado='le queda poco';when='Pronto';}
  else{estado='aún le falta';when='Programado';}
  return{aplica:true,due:due,txt:due?'Le toca trasplante':'Trasplante',sub:lleva+' · '+cada+' → '+estado,when:when};}

function luzInfo(p,s){const need=LUZNEED[s.t];if(need==null)return null;
  const real=(p.light===0||p.light===1||p.light===2);
  const have=real?p.light:(p.loc&&LUZLUGAR[p.loc]!=null?LUZLUGAR[p.loc]:null);
  if(have==null)return{status:'nodata',need:need};
  let status;
  if(need===2)status=have>=2?'ok':'poco';
  else if(need===1)status=have===1?'ok':(have>1?'mucho':'poco');
  else status=have<=1?'ok':'mucho';
  return{status:status,need:need,have:have};}
function mejoresLugares(need){return Object.keys(LUZLUGAR).filter(k=>{const h=LUZLUGAR[k];if(h==null)return false;
  return need===2?h===2:(need===1?h===1:h<=1);}).slice(0,5).map(k=>LUGARES[k].em+' '+LUGARES[k].n).join(', ');}

function cosechaInfo(p,s){if(s.t!=='t7')return null;
  if(PERENNE.has(s.id))return{perenne:true};
  const d=COSECHA[s.id];

  const nd=new Date(base);nd.setDate(base.getDate()+d);const now=new Date();now.setHours(12,0,0,0);

function careStatus(p,s){const days=RIEGODAYS[s.t][p.pot];
  if(isToday(p.lastWater))return{t:'Regada hoy',cls:'ok'};
  if(!p.lastWater)return{t:'Sin registro de riego aún',cls:''};
  const last=pd(p.lastWater);const tn=new Date();tn.setHours(12,0,0,0);
  const diff=Math.round((tn-last)/86400000);const next=days-diff;
  if(next<0)return{t:'Riego atrasado '+(-next)+' día'+(-next>1?'s':''),cls:'warn'};
  if(next===0)return{t:'Revisa la humedad hoy',cls:'warn'};
  return{t:'Regada hace '+diff+'d · próximo en '+next+'d',cls:''};}
function riegoShort(p,s){const pi=propagationInfo(p);if(pi)return{label:pi.m.em+' '+pi.label,cls:pi.needs?'warn':'ok2',needs:pi.needs};if(rainActive()&&isOutdoor(p))return{label:'lluvia · pausa 48 h',cls:'ok2',needs:false};const days=RIEGODAYS[s.t][p.pot];
  if(!p.lastWater)return{label:'revisa humedad',cls:'',needs:true};
  const last=pd(p.lastWater);const tn=new Date();tn.setHours(12,0,0,0);
  const nd=new Date(last);nd.setDate(last.getDate()+days);const dn=Math.round((nd-tn)/86400000);
  if(dn<0)return{label:'atrasado · '+fmtShort(nd),cls:'warn',needs:true};
  if(dn===0)return{label:'revisa humedad',cls:'warn',needs:true};
  return{label:'próx. riego '+fmtShort(nd),cls:'ok2',needs:false};}
function riegoInfo(p,s){const days=RIEGODAYS[s.t][p.pot];
  if(!p.lastWater)return{last:'Sin registro',lastCls:'muted',next:'Registra tu 1er riego',nextCls:'muted'};
  const last=pd(p.lastWater);const tn=new Date();tn.setHours(12,0,0,0);
  const dl=Math.round((tn-last)/86400000);
  const nd=new Date(last);nd.setDate(last.getDate()+days);const dn=Math.round((nd-tn)/86400000);
  const lastTxt=fmtShort(last)+' · '+(dl===0?'hoy':'hace '+dl+'d');
  let nextTxt,nextCls='';
  if(dn<0){nextTxt=fmtShort(nd)+' · atrasado '+(-dn)+'d';nextCls='warn';}
  else if(dn===0){nextTxt='Hoy · '+fmtShort(nd);nextCls='warn';}
  else{nextTxt=fmtShort(nd)+' · en '+dn+'d';}
  return{last:lastTxt,lastCls:'',next:nextTxt,nextCls:nextCls};}

function agendaItemsForDate(dateISO){
  const today=todayISO(),isNow=dateISO===today,items=[];
  customReminders().forEach(r=>{
    const dueHere=r.date===dateISO,overdue=isNow&&!r.done&&r.date<today;if(!(dueHere||overdue))return;
    const p=r.pid?plants.find(x=>x.id===r.pid):null,rt=REMINDER_TYPES[r.type]||REMINDER_TYPES.otro;

  });

      if(checked)items.push({kind:'prop',pid:p.id,icon:'✓',type:'Propagación · '+pi.m.n,name:p.nombre,reason:'Revisión registrada hoy. Próxima comprobación: '+fmtShort(pd(pi.due))+'.',severity:'done',action:'Ver ficha'});
      else if(pi.due===dateISO||(isNow&&pi.due<today)){const late=Math.max(0,Math.round((pd(today)-pd(pi.due))/86400000));items.push({kind:'prop',pid:p.id,icon:pi.m.em,type:'Propagación · '+pi.m.n,name:p.nombre,reason:late?'La revisión lleva '+late+' día'+(late>1?'s':'')+' pendiente. '+pi.m.task+'.':pi.m.task+'. Observa raíces, olor, firmeza y humedad antes de intervenir.',severity:late?'priority':isNow?'today':'upcoming',action:isNow?'Registrar revisión':'Ver ficha'});}
      return;
    }
    if(isToday(p.lastWater)&&isNow)items.push({kind:'water',pid:p.id,icon:'✓',type:'Riego',name:p.nombre,reason:'Riego registrado hoy.',severity:'done',action:'Deshacer'});
    else if(p.lastWater){const due=offsetISO(p.lastWater,RIEGODAYS[s.t][p.pot]||7);
      if(due===dateISO||(isNow&&due<today&&!rainActive())){const late=Math.max(0,Math.round((pd(today)-pd(due))/86400000));items.push({kind:'water',pid:p.id,icon:'💧',type:type,name:p.nombre,reason:late?'La revisión orientativa lleva '+late+' día'+(late>1?'s':'')+' pendiente. Comprueba el sustrato antes de regar.':'Hoy corresponde comprobar la humedad; la fecha no sustituye tocar el sustrato.',severity:late>1?'priority':isNow?'today':'upcoming',action:isNow?'Registrar riego':'Ver ficha'});}
    }else if(isNow){items.push({kind:'water',pid:p.id,icon:'💧',type:type,name:p.nombre,reason:'Aún no tiene una referencia de riego. Comprueba la humedad y registra el primero sin salir de la agenda.',severity:'review',action:'Registrar riego'});}
    if(isToday(p.lastFert)&&isNow)items.push({kind:'fert',pid:p.id,icon:'✓',type:'Abonado',name:p.nombre,reason:'Abonado registrado hoy.',severity:'done',action:'Deshacer'});
    else if(p.lastFert&&fertDays(s.t)){const fd=offsetISO(p.lastFert,fertDays(s.t));if(fd===dateISO||(isNow&&fd<today)){items.push({kind:'fert',pid:p.id,icon:'🌱',type:'Abonado',name:p.nombre,reason:'Evalúa etapa de crecimiento, humedad y estado general antes de aplicar fertilizante.',severity:isNow?'review':'upcoming',action:isNow?'Registrar abono':'Ver ficha'});}}
    if(isNow){const tr=trasplanteInfo(p,s);if(tr.aplica&&tr.due)items.push({kind:'open',pid:p.id,icon:'🪴',type:'Trasplante',name:p.nombre,reason:tr.sub,severity:'review',action:'Evaluar ficha'});
      const lz=luzInfo(p,s);if(lz&&(lz.status==='poco'||lz.status==='mucho'))items.push({kind:'open',pid:p.id,icon:lz.status==='poco'?'☀️':'🌤️',type:'Ubicación',name:p.nombre,reason:lz.status==='poco'?'La ubicación registrada parece tener menos luz de la necesaria.':'La ubicación registrada podría exponerla a demasiado sol.',severity:'review',action:'Revisar luz'});

function propGuide(s,method){

    agua:'Mantén hojas y pecíolos fuera del agua. Sumerge solo la base y los nodos destinados a emitir raíces. Cada 2 días Saphi pedirá revisar olor, turbidez y tejido blando; cambia el agua y limpia el recipiente si hay señales de estancamiento.',

    sphagnum:'Exprime el sphagnum antes de usarlo: húmedo, no chorreando. Rodea el nodo sin compactar y ventila con frecuencia. Saphi programará una revisión cada 3 días.',

function resizeImageToBase64(file, maxSide=800, quality=0.8){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxSide || h > maxSide){
          if(w > h){ h = Math.round((h * maxSide) / w); w = maxSide; }
          else{ w = Math.round((w * maxSide) / h); h = maxSide; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        resolve({ base64: dataUrl.split(',')[1], dataUrl, mimeType:'image/jpeg' });
      };
      img.onerror = () => reject(new Error('No se pudo procesar la imagen'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Error al leer el archivo'));
    reader.readAsDataURL(file);
  });
}

function parseIdentifyResponse(j){

  const rawId=d.matchId||d.speciesId||d.catalogId||d.id||'';
  const species=SPECIES.find(s=>s.id===rawId&&s.id.indexOf('otra')!==0);
  let confidence=Number(d.confidence!=null?d.confidence:d.score);
  if(!isFinite(confidence))confidence=0;
  if(confidence>1&&confidence<=100)confidence=confidence/100;
  const rawAlt=Array.isArray(d.alternatives)?d.alternatives:[];
  const alternatives=rawAlt.map(x=>typeof x==='string'?x:(x&&(x.matchId||x.speciesId||x.id))).filter((id,i,a)=>id&&id!==rawId&&a.indexOf(id)===i).map(id=>SPECIES.find(s=>s.id===id&&s.id.indexOf('otra')!==0)).filter(Boolean).slice(0,3);
  return {species,confidence:Math.max(0,Math.min(1,confidence)),alternatives};
}

function calcNPK(){
  const n=numv('c-n'),p=numv('c-p'),k=numv('c-k');let area=numv('c-area');if(area<=0)area=10000;const ha=area/10000;
  const dap=p>0?p/0.46:0;const nDap=dap*0.18;let restoN=n-nDap;const cubierto=restoN<0;if(restoN<0)restoN=0;const urea=restoN/0.46;const mop=k>0?k/0.60:0;
  const dapT=dap*ha,ureaT=urea*ha,mopT=mop*ha;const sac=x=>x/50;
  let h='<div class="calc-res">Para <b>'+nf(area,0)+' m²</b> · objetivo '+nf(n,0)+'-'+nf(p,0)+'-'+nf(k,0)+' kg/ha:<br>'
    +'🟦 <b>Urea (46-0-0):</b> '+nf(ureaT,1)+' kg · '+nf(sac(ureaT),1)+' sacos de 50 kg<br>'
    +'🟩 <b>DAP (18-46-0):</b> '+nf(dapT,1)+' kg · '+nf(sac(dapT),1)+' sacos<br>'
    +'🟥 <b>Muriato de potasio (0-0-60):</b> '+nf(mopT,1)+' kg · '+nf(sac(mopT),1)+' sacos'
    +(cubierto?'<br><span style="color:var(--terracota)">El DAP ya aporta todo el N necesario: no hace falta urea.</span>':'')
    +'<div class="tech-src">Método: DAP para cubrir el P₂O₅ → se resta el N que aporta el DAP → la urea cubre el N restante → el muriato cubre el K₂O. Fuentes: FUNAAB PCP 301; Univ. of Arkansas Extension FSA2223.</div></div>';
  document.getElementById('c-npk-res').innerHTML=h;buzz(15);
}
function calcSev(){
  const enf=numv('s-enf'),tot=numv('s-tot');const inc=tot>0?(enf/tot*100):0;
  const g=[numv('g0'),numv('g1'),numv('g2'),numv('g3'),numv('g4')];const N=g.reduce((a,b)=>a+b,0);const sum=g.reduce((a,b,i)=>a+b*i,0);const sev=N>0?(sum/(N*4)*100):0;
  let h='<div class="calc-res">'
    +'🦠 <b>Incidencia:</b> '+nf(inc,1)+' %'+(tot>0?' ('+nf(enf,0)+' de '+nf(tot,0)+')':'')+'<br>'
    +'📊 <b>Severidad (Townsend-Heuberger):</b> '+nf(sev,1)+' %'+(N>0?' · n='+nf(N,0)+' plantas':'')
    +'<div class="tech-src">Incidencia = (enfermas ÷ total) × 100. Severidad = [ Σ(grado × n° plantas) ÷ (total × grado máximo) ] × 100. Fuente: Townsend & Heuberger (1943), Plant Disease Reporter 27:340-343.</div></div>';
  document.getElementById('c-sev-res').innerHTML=h;buzz(15);
}
function calcSust(){
  const box=document.getElementById('c-sust-res');if(!box)return;let tot=0,detail='';if(isTech()){const beds=numv('u-beds'),len=numv('u-length'),width=numv('u-width'),depth=numv('u-depth');if(beds<=0||len<=0||width<=0||depth<=0){box.innerHTML='<div class="calc-res">Completa las cuatro medidas de la cama.</div>';return;}const m3=beds*len*width*(depth/100);tot=m3*1000;detail='<b>'+nf(m3,2)+' m³</b> para '+nf(beds,0)+' cama'+(beds===1?'':'s')+'.';}else{const count=numv('u-count'),top=numv('u-top'),bottom=numv('u-bottom'),height=numv('u-height');if(count<=0||top<=0||bottom<=0||height<=0){box.innerHTML='<div class="calc-res">Completa cantidad y medidas interiores de la maceta.</div>';return;}const one=Math.PI*height*(top*top+top*bottom+bottom*bottom)/12000*.9;tot=one*count;detail='<b>'+nf(one,1)+' L útiles por maceta</b> · '+nf(count,0)+' maceta'+(count===1?'':'s')+'.';}const bags=b=>Math.ceil(tot/b);box.innerHTML='<div class="calc-res">'+detail+'<br>Total estimado: <b>'+nf(tot,1)+' L</b>.<br>Compra aproximada: <b>'+bags(15)+'</b> sacos de 15 L · <b>'+bags(30)+'</b> de 30 L · <b>'+bags(50)+'</b> de 50 L.<div class="tech-src">Macetas: volumen de tronco de cono con 90 % de llenado. Camas: largo × ancho × profundidad × cantidad. Añade margen por asentamiento si el material se compacta.</div></div>';buzz(15);
}
function calcDilution(){
  const dose=numv('d-dose'),tank=numv('d-tank'),box=document.getElementById('c-dil-res');if(!box)return;let solution=0,scope='';if(isTech()){const area=numv('d-area'),volume=numv('d-volume');if(area<=0||volume<=0||dose<=0||tank<=0){box.innerHTML='<div class="calc-res">Completa dosis, área, volumen de aplicación y tanque.</div>';return;}solution=area/10000*volume;scope=nf(area,0)+' m² a '+nf(volume,0)+' L/ha';}else{const count=numv('d-count'),per=numv('d-per');if(count<=0||per<=0||dose<=0||tank<=0){box.innerHTML='<div class="calc-res">Completa dosis, número de plantas, consumo por planta y regadera.</div>';return;}solution=count*per/1000;scope=nf(count,0)+' plantas usando '+nf(per,0)+' ml por planta';}const product=solution*dose,full=Math.floor(solution/tank),rest=Math.max(0,solution-full*tank),loads=Math.ceil(solution/tank),perTank=dose*tank;box.innerHTML='<div class="calc-res">Para <b>'+scope+'</b>:<br>Solución total: <b>'+nf(solution,2)+' L</b> · producto total: <b>'+nf(product,2)+' ml o g</b>.<br>Necesitas <b>'+loads+' carga'+(loads===1?'':'s')+'</b> de '+nf(tank,1)+' L'+(rest>0&&rest<tank?' (la última de '+nf(rest,2)+' L)':'')+'.<br>Cada tanque completo lleva <b>'+nf(perTank,2)+' ml o g</b>.<div class="tech-src">Saphi no inventa la dosis: usa la etiqueta para calcular el total de la jornada y dividirlo en cargas reales.</div></div>';buzz(15);
}
function calcDensity(){
  const row=numv('den-row'),plant=numv('den-plant'),area=numv('den-area'),box=document.getElementById('c-den-res');if(!box)return;if(row<=0||plant<=0||area<=0){box.innerHTML='<div class="calc-res">Completa las tres medidas con valores mayores que cero.</div>';return;}
  const perPlant=row*plant,perHa=10000/perPlant,total=area/perPlant;box.innerHTML='<div class="calc-res">Densidad teórica: <b>'+nf(perHa,0)+' plantas/ha</b>.<br>Para '+nf(area,0)+' m²: ≈ <b>'+nf(Math.floor(total),0)+' plantas</b>.<div class="tech-src">Cálculo rectangular sin descontar caminos, bordes, fallas ni cabeceras. Ajusta la población útil al diseño real.</div></div>';buzz(15);
}
function calcGermination(){
  const ok=numv('ger-ok'),total=numv('ger-total'),box=document.getElementById('c-ger-res');if(!box)return;if(total<=0||ok<0||ok>total){box.innerHTML='<div class="calc-res">El total debe ser mayor que cero y el valor observado no puede superarlo.</div>';return;}
  const pct=ok/total*100;box.innerHTML='<div class="calc-res"><b>'+nf(pct,1)+' %</b> de germinación o emergencia ('+nf(ok,0)+' de '+nf(total,0)+').<div class="tech-src">Porcentaje = observadas ÷ total × 100. Registra fecha, lote y criterio de evaluación para poder comparar.</div></div>';buzz(15);
}
// ---------- luxómetro ----------
function stopLuxCamera(){try{if(luxInterval){clearInterval(luxInterval);luxInterval=null;}if(luxStream){luxStream.getTracks().forEach(t=>t.stop());luxStream=null;}}catch(e){}}
// ⚠️ CÓDIGO CRÍTICO PARA FUNCIONAMIENTO EN ANDROID / IOS
// Clasifica el lux aproximado en 4 tramos (idx 0-3) y lo mapea al nivel 0/1/2 de la app.
// ⚠️ La cámara del celular auto-ajusta el brillo: el valor es ORIENTATIVO, no un lux calibrado.
function luxClassify(lx){
  if(lx<2000)   return {idx:0,level:0,bg:'#C15B33',pill:'🔴 Sombra / poca luz',tip:toneText('Rincón oscuro. Solo aguantan aquí las plantas de sombra.','Baja irradiancia (<2.000 lx): insuficiente para heliófilas.')};
  if(lx<12000)  return {idx:1,level:1,bg:'#4F8B4A',pill:'🟢 Luz indirecta brillante',tip:toneText('Clara pero sin sol directo. Ideal para follaje tropical, orquídeas y potos.','Luz difusa (2.000–12.000 lx): óptimo para sotobosque.')};
  if(lx<30000)  return {idx:2,level:2,bg:'#E4A62C',pill:'🟡 Muy luminoso (sol suave)',tip:toneText('Mucha luz, con algo de sol. Bien para plantas de sol que no sea del mediodía.','Alta irradiancia (12.000–30.000 lx): sol parcial.')};
  return          {idx:3,level:2,bg:'#C6871A',pill:'☀️ Pleno sol',tip:toneText('Sol pleno: perfecto para cactus, suculentas, huerto y arbustos de flor.','Radiación directa (>30.000 lx): heliófilas de exterior.')};
}
// ⚠️ CÓDIGO CRÍTICO PARA FUNCIONAMIENTO EN ANDROID / IOS
function startLuxCamera(expectedType){
  const video = document.getElementById('lux-video');
  const reading = document.getElementById('lux-reading');
  const pill = document.getElementById('lux-pill');
  const desc = document.getElementById('lux-desc');
  if(!video||!reading||!pill||!desc)return;
  const canvas = document.createElement('canvas');
  canvas.width = 32; canvas.height = 32;
  const ctx = canvas.getContext('2d');
  if (location.protocol === 'file:') {
    reading.textContent = 'Abre con HTTPS';
    pill.style.background = '#C15B33';
    pill.textContent = '⚠️ Bloqueo de seguridad móvil';
    desc.innerHTML = 'En celulares, los navegadores bloquean la cámara si abres el archivo local. Ábrela desde tu dominio (Vercel/HTTPS).';
    return;
  }
  video.muted = true; video.playsInline = true;
  video.setAttribute('playsinline', ''); video.setAttribute('muted', '');
  const constraints = { video: { facingMode: { ideal: 'environment' }, width: { ideal: 640 }, height: { ideal: 480 } }, audio: false };
  navigator.mediaDevices.getUserMedia(constraints)
    .catch(() => navigator.mediaDevices.getUserMedia({ video: true, audio: false }))
    .then(stream => {
      luxStream = stream; video.srcObject = stream;
      video.onloadedmetadata = () => { video.play().catch(() => {}); };
      luxInterval = setInterval(() => {
        if (video.videoWidth > 0 && !video.paused) {
          ctx.drawImage(video, 0, 0, 32, 32);
          const data = ctx.getImageData(0, 0, 32, 32).data;
          let sum = 0;
          for (let i = 0; i < data.length; i += 4) { sum += (0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2]); }
          const avg = sum / (data.length / 4);
          // techo elevado a ~45.000 lx para poder distinguir "muy luminoso" de "pleno sol"
          const approxLux = Math.round(Math.pow(avg / 255, 2.0) * 45000);
          const c = luxClassify(approxLux);
          luxCurLux = approxLux; luxCurLevel = c.level;
          reading.textContent = '≈ ' + approxLux.toLocaleString() + ' lux';
          pill.style.background = c.bg; pill.textContent = c.pill;
          desc.textContent = c.tip;
          // barra de escala (4 tramos)
          const sc = document.getElementById('lux-scale');
          if(sc){[...sc.children].forEach((seg,i)=>seg.classList.toggle('on',i===c.idx));}
          // comparación con lo que pide el tipo registrado
          const cmp = document.getElementById('lux-cmp');
          if(cmp && expectedType && LUZNEED[expectedType]!=null){
            const need=LUZNEED[expectedType];
            if(c.level<need){cmp.className='lux-cmp low';cmp.innerHTML='⬇️ <b>Le falta luz aquí.</b> Esta planta pide '+LUZTXT[need]+'. Búscale un sitio más luminoso.';}
            else if(c.level>need){cmp.className='lux-cmp high';cmp.innerHTML='⬆️ <b>Demasiada luz aquí.</b> Esta planta prefiere '+LUZTXT[need]+'; podría quemarse. Filtra el sol o aléjala de la ventana.';}
            else{cmp.className='lux-cmp ok';cmp.innerHTML='👍 <b>Este rincón le va bien:</b> coincide con lo que pide ('+LUZTXT[need]+').';}
          }
          // modo rincón: sugerir qué plantas de la colección encajan
          const sug = document.getElementById('lux-suggest');
          if(sug){
            const fit=plants.filter(p=>LUZNEED[sp(p.esp).t]===c.level).map(p=>esc(p.nombre));
            if(fit.length)sug.innerHTML='<div class="luzcard ok"><div class="luz-ic">🪴</div><div class="luz-tx"><div class="luz-h">Aquí irían bien</div><div class="luz-m">'+fit.slice(0,6).join(', ')+(fit.length>6?'…':'')+'</div></div></div>';
            else sug.innerHTML='<div class="luzcard"><div class="luz-ic">🪴</div><div class="luz-tx"><div class="luz-h">Para este nivel de luz</div><div class="luz-m">'+LUZTXT[c.level]+'. Ninguna de tus plantas registradas pide justo esto ahora mismo.</div></div></div>';
          }
          // habilita el botón "usar" (modo registro)
          const use=document.getElementById('lux-use');
          if(use)use.textContent='✓ Usar: '+LUZOPT[c.level].em+' '+LUZOPT[c.level].n;
        }
      }, 400);
    })
    .catch(err => {
      reading.textContent = 'Error de cámara';
      pill.style.background = '#C15B33';
      pill.textContent = err.name === 'NotAllowedError' ? 'Permiso denegado' : 'No disponible';
      desc.textContent = 'Concede permiso de cámara en tu navegador. En el artefacto de Claude la cámara puede estar bloqueada; usa la versión instalada.';
    });
}
function openLux(pid){luxMode='plant';view='lux';const nav=document.querySelector('.nav');if(nav)nav.style.display='';document.getElementById('fab').style.display='none';setTop('list');renderLux(pid);}
function openLuxGlobal(){closeMenu();luxMode='global';view='lux';const nav=document.querySelector('.nav');if(nav)nav.style.display='';document.getElementById('fab').style.display='none';setTop('list');renderLux(null);}
function openLuxForRegister(){luxMode='register';view='lux';const nav=document.querySelector('.nav');if(nav)nav.style.display='';document.getElementById('fab').style.display='none';setTop('list');renderLux(null);}
function backToAddKeepDraft(){view='add';setTop('add');document.getElementById('fab').style.display='none';renderAdd(editingId!=null?plantById(editingId):null,true);}
function useLuxForRegister(){if(luxCurLevel!=null)draft.light=luxCurLevel;stopLuxCamera();backToAddKeepDraft();toast('Luz medida ✔️');}
function renderLux(pid){luxCurLevel=null;luxCurLux=0;
  const p=(pid!=null)?plants.find(x=>x.id===pid):null;const s=p?sp(p.esp):null;
  // en modo registro comparamos con la especie que se está registrando (si ya la eligió)
  const regType=(luxMode==='register'&&draft&&draft.esp)?sp(draft.esp).t:null;
  const expectedType=s?s.t:regType;
  let back;
  if(luxMode==='register')back='<button class="back-lnk" onclick="backToAddKeepDraft()">‹ Volver al registro</button>';
  else if(luxMode==='global')back='<button class="back-lnk" onclick="openTools()">‹ Volver a Herramientas</button>';
  else back='<button class="back-lnk" onclick="goFicha('+pid+')">‹ Volver a la ficha</button>';
  let h=back;
  h+='<h2 class="sc">☀️ Luxómetro</h2><p class="sub">'+(luxMode==='global'?'Apunta la cámara hacia el rincón que quieras evaluar.':'Apunta la cámara hacia donde está (o pondrás) la planta.')+'</p>';
  h+='<div class="lux-box"><video id="lux-video" autoplay playsinline muted></video></div>';
  h+='<div class="lux-reading" id="lux-reading">Iniciando…</div>';
  h+='<div class="lux-scale" id="lux-scale"><span class="ls-seg" style="background:#C15B33"></span><span class="ls-seg" style="background:#4F8B4A"></span><span class="ls-seg" style="background:#E4A62C"></span><span class="ls-seg" style="background:#C6871A"></span></div>';
  h+='<div class="lux-pill" id="lux-pill">Midiendo…</div><p class="lux-desc" id="lux-desc"></p>';
  if(expectedType)h+='<div id="lux-cmp"></div>';
  if(luxMode==='global')h+='<div class="lux-suggest" id="lux-suggest"></div>';
  if(expectedType)h+='<div class="tech-src">Esta planta ('+TYPES[expectedType].tag+') prefiere: '+LUZTXT[LUZNEED[expectedType]]+' · '+LUXTARGET[expectedType]+'.</div>';
  else h+='<div class="tech-src">Valor orientativo (la cámara auto-ajusta el brillo). Fíjate más en el nivel — Sombra / Indirecta / Muy luminoso / Pleno sol — que en el número.</div>';
  if(luxMode==='register')h+='<button class="lux-use" id="lux-use" onclick="useLuxForRegister()">✓ Usar esta medición</button>';
  content.innerHTML=h;playView();startLuxCamera(expectedType);}
// ---------- riego en lote + clima inteligente + Google Calendar ----------
function batchWaterLocation(locKey){const t=todayISO();let n=0;plants.forEach(p=>{if(p.loc===locKey){p.lastWater=t;n++;}});if(n){logAction();save();renderList();toast('💧 '+n+' planta'+(n>1?'s':'')+' regada'+(n>1?'s':'')+' en '+(LUGARES[locKey]?LUGARES[locKey].n:'este lugar'));}}
function checkSmartWeather(){return {heladas:plants.some(p=>p.region==='sierra'&&(p.alt||0)>=2400), lluvia:getWx()==='lluvia'};}
function nextRiegoISO(p,s){if(!p.lastWater)return todayISO();const nd=pd(p.lastWater);nd.setDate(nd.getDate()+(RIEGODAYS[s.t][p.pot]||7));return isoLocal(nd);}
function googleCalUrl(plant,nextDateStr){const title='💧 Regar '+plant.nombre;const details='Recordatorio de Saphi para '+plant.nombre+' en maceta '+(POTS[plant.pot]?POTS[plant.pot].n:'—')+'.';const start=nextDateStr.replace(/-/g,'')+'T083000';const end=nextDateStr.replace(/-/g,'')+'T090000';return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+'&details='+encodeURIComponent(details)+'&dates='+start+'/'+end;}
function addCalReminder(pid){const p=plants.find(x=>x.id===pid);if(!p)return;const s=sp(p.esp),pi=propagationInfo(p);if(pi&&pi.lost){toast('Este lote ya no necesita revisiones');return;}let url;if(pi){const date=pi.due.replace(/-/g,''),title=pi.m.em+' Revisar propagación · '+p.nombre,details=pi.m.task+'. Observa raíces, olor, firmeza y humedad antes de intervenir.';url='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+'&details='+encodeURIComponent(details)+'&dates='+date+'T083000/'+date+'T090000';}else url=googleCalUrl(p,nextRiegoISO(p,s));try{window.open(url,'_blank');}catch(e){location.href=url;}}
function rainActive(){try{return (Date.now()-(+localStorage.getItem('saphi_raindelay')||0))<48*3600*1000;}catch(e){return false;}}
function isOutdoor(p){return ['patio','terraza','balcon','jardin','azotea','exterior'].indexOf(p.loc)>=0;}
function setRainDelay(){try{localStorage.setItem('saphi_raindelay',Date.now());}catch(e){}toast('🌧️ Pausa de riego 48 h para el exterior');if(view==='home')renderHome();else renderList();}
function clearRainDelay(){try{localStorage.removeItem('saphi_raindelay');}catch(e){}toast('Pausa de lluvia desactivada');if(view==='home')renderHome();else renderList();}

// ---------- respaldo ----------
function markBackup(){try{localStorage.setItem('saphi_lastbackup',Date.now());}catch(e){}}
async function exportBackup(){closeMenu();
  const json=JSON.stringify({app:'Saphi',v:3,fecha:new Date().toISOString(),plants:plants,reminders:customReminders()},null,2);
  // 1) capacidad de descargas del artefacto (página publicada en Claude)
  try{
    if(window.claude&&window.claude.use){
      const dl=await window.claude.use('downloads');
      if(dl){await dl.save({filename:'saphi_respaldo.json',data:json});markBackup();toast('Respaldo guardado ⬇️');return;}
    }
  }catch(e){ if(e&&e.code==='declined'){toast('Descarga cancelada');return;} /* si falla, caemos al método clásico */ }
  // 2) método clásico (archivo local / navegador normal)
  try{const blob=new Blob([json],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='saphi_respaldo.json';a.click();markBackup();toast('Respaldo exportado ⬇️');}
  catch(e2){toast('No se pudo exportar el respaldo');}
}
function importBackup(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=e=>{try{const d=JSON.parse(e.target.result);if(d.plants){plants=d.plants;if(Array.isArray(d.reminders))saveCustomReminders(d.reminders);save();goList();toast('Respaldo importado ⬆️');}else toast('Archivo no válido');}catch(x){toast('No se pudo leer el archivo');}};
  r.readAsText(f);ev.target.value='';}

// ---------- util ----------
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
let toastT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1900);}
function toggleMenu(e,btn){e.stopPropagation();const m=document.getElementById('menu'),open=!m.classList.contains('show');m.classList.toggle('show',open);if(btn)btn.setAttribute('aria-expanded',open?'true':'false');}
function closeMenu(){document.getElementById('menu').classList.remove('show');const b=document.querySelector('.menu-trigger');if(b)b.setAttribute('aria-expanded','false');}
document.addEventListener('click',closeMenu);
// Las acciones que redibujan la misma vista conservan el punto de lectura.
document.addEventListener('click',event=>{
  const button=event.target.closest('button');if(!button||!content)return;
  const action=String(button.getAttribute('onclick')||'');
  if(button.closest('.ficha-nav')||action.indexOf('applySymptomDiag')>=0||action.indexOf('jumpToolsCalculators')>=0)return;
  const beforeView=view,beforeTop=content.scrollTop;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{if(view===beforeView&&content.scrollTop!==beforeTop)content.scrollTop=beforeTop;}));
},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('delete-confirm'))cancelDeletePlant();});

// ---------- secciones plegables (recordar estado abierto) ----------
const openSecs=new Set();
function secOpen(id){return openSecs.has(id)?' open':'';}
function rememberSec(el){if(!el||!el.id)return;if(el.open)openSecs.add(el.id);else openSecs.delete(el.id);}

// ---------- notificaciones · Fase A (recordatorios locales) ----------
const APP_ICON='icon-192.png';
function notifOn(){try{return localStorage.getItem('saphi_notif')==='1';}catch(e){return false;}}
function setNotif(v){try{localStorage.setItem('saphi_notif',v?'1':'0');}catch(e){}}
async function toggleNotif(){
  closeMenu();
  if(!('Notification'in window)){toast('Tu navegador no soporta notificaciones');return;}
  if(notifOn()){setNotif(false);toast('🔕 Recordatorios desactivados');if(view==='home')renderHome();else if(view==='calendar')renderCalendar();return;}
  let perm=Notification.permission;
  if(perm!=='granted'){try{perm=await Notification.requestPermission();}catch(e){perm=Notification.permission;}}
  if(perm!=='granted'){toast('Debes permitir las notificaciones en el navegador');return;}
  setNotif(true);
  subscribeWebPush(); // push real si hay backend + claves VAPID (Fase B)
  toast('🔔 Recordatorios activados');
  notifyNow('🌱 Saphi','Listo: te avisaré cuando toque regar tus plantas.');
  if(view==='home')renderHome();else if(view==='calendar')renderCalendar();
}
function notifyNow(title,body){
  if(!('Notification'in window)||Notification.permission!=='granted')return;
  try{
    if(navigator.serviceWorker&&navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(reg=>reg.showNotification(title,{body:body,icon:APP_ICON,badge:APP_ICON,tag:'saphi-riego'})).catch(()=>{try{new Notification(title,{body:body});}catch(e){}});
    }else{new Notification(title,{body:body});}
  }catch(e){}
}
// Avisa una vez al día sobre revisiones de riego y recordatorios propios.
function maybeNotifyToday(){
  if(!notifOn()||!('Notification'in window)||Notification.permission!=='granted')return;
  const t=todayISO();let last=null;try{last=localStorage.getItem('saphi_notif_day');}catch(e){}
  if(last===t)return;
  const need=plants.filter(p=>riegoShort(p,sp(p.esp)).needs);
  const own=customReminders().filter(r=>!r.done&&r.date<=t);
  if(!need.length&&!own.length)return;
  try{localStorage.setItem('saphi_notif_day',t);}catch(e){}
  const parts=[];if(need.length)parts.push(need.length+' planta'+(need.length>1?'s':'')+' por observar');if(own.length)parts.push(own.length+' recordatorio'+(own.length>1?'s':'')+' pendiente'+(own.length>1?'s':''));
  notifyNow('🌱 Saphi · agenda de hoy',parts.join(' · '));
}

// ---------- PWA · Service Worker + Web Push (Fase B) ----------
// Pega tu clave pública VAPID cuando configures el backend en Vercel. Vacío = push real off (solo recordatorios locales).
const VAPID_PUBLIC_KEY='';
function registerSW(){
  if(!('serviceWorker'in navigator)||location.protocol==='file:')return;
  try{navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}
}
function urlB64ToUint8(base64){const pad='='.repeat((4-base64.length%4)%4);const b=(base64+pad).replace(/-/g,'+').replace(/_/g,'/');const raw=atob(b);const arr=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);return arr;}
async function subscribeWebPush(){
  if(!VAPID_PUBLIC_KEY)return; // sin claves VAPID no hay push real todavía
  if(!('serviceWorker'in navigator)||!('PushManager'in window))return;
  try{
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64ToUint8(VAPID_PUBLIC_KEY)});
    await fetch('/api/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(sub)});
  }catch(e){}
}

// ---------- init ----------
// ---------- ergonomía de campo ----------
function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms||25);}catch(e){}}
function solOn(){try{return localStorage.getItem('saphi_sol')==='1';}catch(e){return false;}}
function applySol(){const a=document.querySelector('.app');if(a)a.classList.toggle('sol',solOn());}
function toggleSol(){closeMenu();try{localStorage.setItem('saphi_sol',solOn()?'0':'1');}catch(e){}applySol();buzz(15);toast(solOn()?'🕶️ Modo sol fuerte activado':'☀️ Modo normal');}

// ---------- init ----------
applySol();load();registerSW();if(!seenOnboarding())renderWelcome();else goHome();
setInterval(maybeNotifyToday,30*60*1000);
