<title>Saphi · Cultiva con criterio</title>
<style>
:root{
  --crema:#FBF6EC;--ambar:#E4A62C;--ambar-osc:#C6871A;--terracota:#C15B33;--terracota-osc:#A94A26;
  --tierra:#5B3A22;--tierra-2:#7A5334;--verde:#4F8B4A;--verde-bg:#E9F1E2;--verde-osc:#3F7A3B;
  --texto:#3A2E22;--tenue:#8A7A66;--card:#FFFFFF;--linea:#EDE3D0;--crema-2:#FDF3DC;
  --sombra:0 10px 28px rgba(91,58,34,.12);--sombra-sm:0 4px 12px rgba(91,58,34,.08);
  --ft:'Poppins',system-ui,sans-serif;--fb:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:#EBE2CE;color:var(--texto);font-family:var(--fb);
  min-height:100vh;display:flex;justify-content:center;align-items:flex-start}
.app{width:100%;max-width:430px;height:100vh;height:100dvh;background:var(--crema);position:relative;overflow:hidden;
  box-shadow:0 0 40px rgba(0,0,0,.12);display:flex;flex-direction:column}
@media(min-width:520px){.app{margin:22px 0;height:calc(100vh - 44px);height:calc(100dvh - 44px);border-radius:30px}}

/* top bar */
.topbar{padding:16px 18px 12px;padding-top:calc(16px + env(safe-area-inset-top,0px));background:linear-gradient(180deg,var(--crema-2),var(--crema));
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:9px}
.brand .bn{font-family:var(--ft);font-weight:700;font-size:19px;color:var(--tierra)}
.tb-right{display:flex;align-items:center;gap:8px}
.chip-region{background:#fff;border:1px solid var(--linea);color:var(--tierra-2);font-weight:800;
  font-size:11px;padding:6px 10px;border-radius:999px;box-shadow:var(--sombra-sm)}
.iconbtn{background:#fff;border:1px solid var(--linea);width:36px;height:36px;border-radius:11px;
  font-size:16px;cursor:pointer;box-shadow:var(--sombra-sm);color:var(--tierra)}
.back{background:none;border:none;font-size:20px;color:var(--tierra);cursor:pointer;padding:4px 6px}
/* selector de perfil (cabecera) - MODIFICADO para integración visual */
.prof-seg{display:flex;gap:4px;background:var(--verde-bg);border:1px solid #C9DDD1;border-radius:16px;padding:4px;box-shadow:none}
.prof-seg .ps{border:none;background:none;height:36px;border-radius:12px;font-size:12px;cursor:pointer;line-height:1;opacity:0.7;padding:0 12px;color:var(--verde-osc);font-weight:700}
.prof-seg .ps.on{background:#fff;opacity:1;box-shadow:0 2px 6px rgba(24,62,52,.1);color:var(--brand-root);}

/* Modo Sol Fuerte (alto contraste para leer bajo el sol) */
.app.sol{--crema:#fff;--crema-2:#f2f2f2;--card:#fff;--texto:#000;--tierra:#000;--tierra-2:#111;--tenue:#3a3a3a;--linea:#000;--verde:#0a6b2f;--verde-osc:#075a27;--ambar-osc:#7a4f00;--terracota:#9a1f0d}
.app.sol{background:#fff}
.app.sol *{box-shadow:none!important;text-shadow:none!important}
.app.sol .home-hero,.app.sol .moon-hero,.app.sol .home-tip,.app.sol .reto{background:#000!important;color:#fff!important}
.app.sol .fchip,.app.sol .opt,.app.sol .locopt,.app.sol .toolbtn,.app.sol .tbtn,.app.sol .card,.app.sol .plant-card,.app.sol .gtile,.app.sol .statuscard,.app.sol .metric,.app.sol .searchbar,.app.sol .field input,.app.sol .field select,.app.sol .diary-add input,.app.sol .prof-seg,.app.sol .iconbtn{border:2px solid #000!important}
.app.sol .btn-primary,.app.sol .diary-save,.app.sol .sharebtn,.app.sol .cta,.app.sol .lux-use,.app.sol .fab{background:#000!important;color:#fff!important;border:2px solid #000!important}
.app.sol .fab{color:#fff!important}

/* content */
.content{flex:1;overflow-y:auto;padding:6px 16px 96px}
.content::-webkit-scrollbar{display:none}
h2.sc{font-family:var(--ft);font-weight:700;font-size:20px;color:var(--tierra);margin:12px 2px 4px}
.sub{color:var(--tenue);font-size:13px;margin:0 2px 14px}

/* list */
.empty{text-align:center;padding:50px 20px;color:var(--tenue)}
.empty .big{font-size:52px;margin-bottom:8px}
.empty p{font-size:14px;line-height:1.5;max-width:260px;margin:6px auto 0}
.plant-card{position:relative;overflow:hidden;display:flex;gap:13px;align-items:center;background:var(--card);border:1px solid var(--linea);
  border-radius:18px;padding:12px 12px 12px 15px;margin-bottom:12px;box-shadow:var(--sombra-sm);cursor:pointer;transition:.15s}
.plant-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--acc,transparent)}
.plant-card:active{transform:scale(.99)}
.thumb{width:62px;height:62px;border-radius:15px;flex:0 0 auto;overflow:hidden;
  background:linear-gradient(160deg,#F6DFA6,#D79A54);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.pc-body{flex:1;min-width:0}
.pc-name{font-family:var(--ft);font-weight:700;font-size:16px;color:var(--tierra)}
.pc-x{color:var(--tenue);font-weight:800;font-size:12px}
.pc-sci{font-style:italic;color:var(--tenue);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px}
.tag.amb{background:#FBEFCD;color:var(--ambar-osc)}
.tag.reg{background:var(--verde-bg);color:var(--verde-osc)}
.tag.st{background:#F0E7D5;color:var(--tierra-2)}
.tag.st.warn{background:#FBE3D6;color:var(--terracota)}
.tag.st.ok{background:var(--verde-bg);color:var(--verde-osc)}
.tag.st.ok2{background:#E7F0FB;color:#3B6FB0}
.pc-arrow{color:var(--tenue);font-size:18px}
.home-head{margin:6px 2px 4px}
.hh-greet{font-family:var(--ft);font-weight:700;font-size:22px;color:var(--tierra)}
.hh-sub{font-size:12.5px;color:var(--tenue);font-weight:700;margin-top:2px}
.sub-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 10px}
.sub-row .sub{margin:0}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}
.fchip{border:1px solid var(--linea);background:#fff;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:800;color:var(--tierra-2);cursor:pointer;white-space:nowrap}
.fchip.on{border-color:var(--ambar);background:#FDF3DC;color:var(--ambar-osc)}
.view-toggle{flex:0 0 auto;display:flex;gap:4px;background:#fff;border:1px solid var(--linea);border-radius:11px;padding:3px}
.vbtn{border:none;background:none;width:32px;height:30px;border-radius:8px;font-size:15px;cursor:pointer;color:var(--tenue)}
.vbtn.on{background:var(--crema-2);color:var(--ambar-osc)}
.qw{flex:0 0 auto;width:44px;height:44px;border-radius:12px;border:1.5px solid var(--linea);background:#fff;font-size:18px;cursor:pointer;box-shadow:var(--sombra-sm)}
.qw.red{border-color:#EBB9A8;background:#FBE3D6}
.qw.blue{border-color:#B8D2EC;background:#E7F0FB}
.grid-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gtile{background:#fff;border:1px solid var(--linea);border-top:3px solid var(--acc,transparent);border-radius:16px;overflow:hidden;cursor:pointer;box-shadow:var(--sombra-sm)}
.gt-img{position:relative;height:112px;display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center}
.gt-tag{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.92);color:var(--ambar-osc);font-size:10px;font-weight:800;padding:3px 7px;border-radius:999px}
.gt-info{padding:9px 11px}
.gt-name{font-family:var(--ft);font-weight:700;font-size:13.5px;color:var(--tierra);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt-wq{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--linea);background:#fff;font-size:15px;line-height:1;cursor:pointer;box-shadow:var(--sombra-sm);display:flex;align-items:center;justify-content:center}
.gt-wq.red{border-color:#EBB9A8;background:#FBE3D6}
.gt-wq.blue{border-color:#B8D2EC;background:#E7F0FB}
.filter-cap{font-size:11.5px;font-weight:800;color:var(--ambar-osc);background:#FDF3DC;border:1px solid #F0DDB0;border-radius:999px;padding:5px 12px;display:inline-block;margin:-6px 2px 12px}
.typelegend{margin:-4px 2px 16px;border:1px solid var(--linea);border-radius:12px;background:var(--crema-2);overflow:hidden}
.typelegend summary{cursor:pointer;font-weight:800;font-size:12px;color:var(--tierra-2);list-style:none;padding:10px 13px}
.typelegend summary::-webkit-details-marker{display:none}
.typelegend summary::after{content:' ▾';color:var(--ambar-osc)}
.typelegend[open] summary::after{content:' ▴';color:var(--ambar-osc)}
.tl-list{padding:2px 13px 12px;display:flex;flex-direction:column;gap:8px}
.tl-item{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:700;color:var(--tierra-2);line-height:1.3}
.tl-dot{flex:0 0 auto;width:11px;height:11px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.searchbar{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--linea);border-radius:13px;padding:0 12px;margin:0 2px 12px}
.searchbar .sb-ic{font-size:14px;color:var(--tenue)}
.searchbar input{flex:1;border:none;background:none;padding:11px 0;font-family:var(--fb);font-size:14.5px;color:var(--texto);outline:none}
.searchbar .sb-clr{border:none;background:none;color:var(--tenue);font-size:15px;cursor:pointer;padding:4px}
.filters.loc-filters{margin:-4px 0 12px}
.fchip.loc.on{border-color:var(--verde);background:var(--verde-bg);color:var(--verde-osc)}
.filter-cap.loc{background:var(--verde-bg);border-color:#CFE2D3;color:var(--verde-osc)}
.tag.loc{background:#EDF2EE;color:var(--verde-osc)}
.gt-loc{font-size:10.5px;font-weight:700;color:var(--tenue);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt-lbl{font-weight:700;color:var(--tenue);font-size:11.5px}
.locgrid{display:flex;flex-wrap:wrap;gap:7px}
.locopt{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--linea);background:#fff;border-radius:11px;padding:8px 11px;font-size:12.5px;font-weight:700;color:var(--tierra-2);cursor:pointer;transition:.12s}
.locopt.sel{border-color:var(--verde);background:var(--verde-bg);color:var(--verde-osc);box-shadow:0 3px 10px rgba(79,139,74,.18)}
.agewrap{display:flex;gap:12px;margin-top:2px}
.agewrap.off{opacity:.4;pointer-events:none}
.agecol{flex:1;background:var(--crema-2);border:1px solid var(--linea);border-radius:14px;padding:10px 8px;text-align:center}
.agelbl{display:block;font-size:11px;font-weight:800;color:var(--tenue);text-transform:uppercase;letter-spacing:.3px;margin-bottom:8px}
.stepper2{display:flex;align-items:center;justify-content:center;gap:10px}
.stepper2 button{width:38px;height:38px;border-radius:11px;border:1.5px solid var(--linea);background:#fff;font-size:20px;font-weight:800;color:var(--tierra);cursor:pointer;line-height:1}
.stepper2 span{font-family:var(--ft);font-weight:700;font-size:20px;color:var(--tierra);min-width:22px;text-align:center}
.tras-hint{margin-top:12px;font-size:12px;color:var(--tierra-2);line-height:1.5;background:var(--crema-2);border-radius:10px;padding:10px 12px}
.grpcard{display:flex;gap:12px;align-items:center;background:#FBEFCD;border:1px solid #F0DDA6;border-radius:14px;padding:12px 13px;margin-top:12px}
.grp-tx{flex:1;font-size:12px;color:var(--tierra-2);line-height:1.5}
.grp-btn{flex:0 0 auto;border:1.5px solid var(--ambar);background:#fff;color:var(--ambar-osc);font-family:var(--ft);font-weight:700;font-size:12px;padding:9px 12px;border-radius:11px;cursor:pointer;white-space:nowrap}
.grp-h{font-family:var(--ft);font-weight:700;font-size:12.5px;color:var(--tierra-2);margin:10px 4px 8px;padding-bottom:5px;border-bottom:1px solid var(--linea)}
.qw,.gt-wq{font-variant-emoji:emoji}
/* perfil (onboarding) */
.wel-q{font-family:var(--ft);font-weight:700;font-size:15px;color:var(--tierra);margin:6px 2px 10px}
.profgrid{display:flex;gap:11px;margin-bottom:20px}
.profopt{flex:1;border:1.5px solid var(--linea);background:#fff;border-radius:16px;padding:14px 12px;cursor:pointer;text-align:center;transition:.12s}
.profopt.sel{border-color:var(--ambar);background:#FDF3DC;box-shadow:0 3px 10px rgba(198,135,26,.2)}
.prof-e{font-size:28px;line-height:1;margin-bottom:6px}
.prof-t{font-family:var(--ft);font-weight:700;font-size:13.5px;color:var(--tierra)}
.prof-x{font-size:11px;color:var(--tenue);line-height:1.4;margin-top:4px}
/* datos técnicos */
.card.tech{border-color:#CBD8DE}
.tech-badge{font-size:10px;font-weight:800;color:#3B6FB0;background:#E7F0FB;border-radius:999px;padding:2px 8px;vertical-align:middle;margin-left:6px}
.techrow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px dashed var(--linea);font-size:12.5px}
.techrow:first-of-type{border-top:none}
.techrow.col{flex-direction:column;gap:3px}
.tk{font-weight:800;color:var(--tenue);flex:0 0 auto}
.tv{color:var(--tierra);text-align:right}
.techrow.col .tv{text-align:left;font-weight:700}
.tech-src{font-size:10.5px;color:var(--tenue);font-style:italic;margin-top:10px;line-height:1.4}
/* diario dinámico */
.growth{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,#EAF3E4,#DDEBCF);border:1px solid #CFE2D3;border-radius:14px;padding:12px 15px;margin-bottom:13px}
.growth-big{font-family:var(--ft);font-weight:700;font-size:26px;color:var(--verde-osc);line-height:1}
.growth-sub{font-size:12px;font-weight:700;color:var(--tierra-2);margin-top:3px}
.spark{width:190px;height:46px;flex:0 0 auto}
.metrics{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.metric{display:flex;align-items:center;gap:6px;flex:1;min-width:96px;border:1.5px solid var(--linea);border-radius:12px;padding:0 10px;background:#fff}
.metric .m-ic{font-size:15px}
.metric input{flex:1;min-width:0;border:none;background:none;outline:none;font-family:var(--fb);font-size:14px;padding:11px 0;color:var(--texto)}
.metric .m-u{font-size:11px;font-weight:800;color:var(--tenue)}
.diary-save{width:100%;margin-top:11px;border:none;background:linear-gradient(180deg,#7FB56A,#4F8B4A);color:#fff;font-family:var(--ft);font-weight:700;font-size:14px;padding:13px;border-radius:13px;cursor:pointer;box-shadow:0 6px 14px rgba(79,139,74,.3)}
.dm-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.dm-chip{font-size:10.5px;font-weight:800;color:var(--verde-osc);background:var(--verde-bg);border-radius:999px;padding:2px 9px}
/* botón compartir */
.sharebtn{width:100%;margin-top:14px;border:none;background:linear-gradient(120deg,#C15B33,#E4A62C);color:#fff;font-family:var(--ft);font-weight:700;font-size:15px;padding:15px;border-radius:15px;cursor:pointer;box-shadow:0 8px 20px rgba(193,91,51,.32);letter-spacing:.2px}
.sharebtn:active{transform:scale(.99)}
.diary-csv{width:100%;margin-top:11px;border:1.5px solid #CFE2D3;background:#fff;color:var(--verde-osc);font-family:var(--ft);font-weight:700;font-size:12.5px;padding:11px;border-radius:12px;cursor:pointer}
/* plagas */
.pest{border-top:1px dashed var(--linea);padding:10px 0}
.pest:first-of-type{border-top:none;padding-top:2px}
.pest-n{font-family:var(--ft);font-weight:700;font-size:13.5px;color:var(--terracota-osc)}
.pest-l{font-size:12px;color:var(--tierra-2);line-height:1.5;margin-top:3px}
.pest-l b{color:var(--tierra)}
/* biblioteca */
.back-lnk{background:none;border:none;color:var(--terracota);font-weight:800;font-size:13px;cursor:pointer;padding:8px 2px;margin-bottom:2px}
.bib-t{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--linea);font-size:12.5px}
.bib-t:first-of-type{border-top:none}
.bib-refs{margin:2px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:9px}
.bib-refs li{font-size:12px;color:var(--tierra-2);line-height:1.5;word-break:break-word}
/* herramientas (diagnóstico, lux, calendario) */
.tool-row{display:flex;gap:10px;margin-top:10px}
.toolbtn{flex:1;border:1.5px solid var(--linea);background:#fff;color:var(--tierra);font-family:var(--ft);font-weight:700;font-size:13px;padding:13px;border-radius:13px;cursor:pointer;box-shadow:var(--sombra-sm)}
.toolbtn.wide{width:100%;margin-top:10px}
/* barra de herramientas compacta (ficha) */
.toolbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.tbtn{border:1.5px solid var(--linea);background:#fff;border-radius:14px;padding:11px 4px;cursor:pointer;box-shadow:var(--sombra-sm);display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--ft);font-weight:700;font-size:10.5px;color:var(--tierra-2);line-height:1.1;text-align:center}
.tbtn .tb-e{font-size:19px;line-height:1}
.tbtn:active{transform:scale(.97)}
/* pie "más herramientas" en Mis Plantas + calculadoras */
.more-sec{margin:22px 2px 10px;border-top:1px solid var(--linea);padding-top:14px}
.more-h{font-family:var(--ft);font-weight:700;font-size:13px;color:var(--tenue);margin:0 2px 10px}
.more-item{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;text-align:left;background:var(--card);border:1px solid var(--linea);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-family:var(--ft);font-weight:700;font-size:13.5px;color:var(--tierra);cursor:pointer;box-shadow:var(--sombra-sm)}
.more-item span{font-family:var(--fb);font-weight:700;font-size:11px;color:var(--tenue);margin-top:1px}
.calc-res{background:var(--crema-2);border:1px solid var(--linea);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:13px;color:var(--tierra);line-height:1.7}
/* luxómetro: comparación con el tipo + escala + usar medición */
.lux-scale{display:flex;gap:4px;margin:12px 8px 0}
.lux-scale .ls-seg{flex:1;height:8px;border-radius:4px;opacity:.3}
.lux-scale .ls-seg.on{opacity:1}
.lux-cmp{margin:12px 8px 0;border-radius:12px;padding:11px 13px;font-size:12.5px;line-height:1.45;font-weight:700}
.lux-cmp.ok{background:var(--verde-bg);color:var(--verde-osc)}
.lux-cmp.low{background:#FBE3D6;color:var(--terracota)}
.lux-cmp.high{background:#FDF3DC;color:var(--ambar-osc)}
.lux-use{width:100%;margin-top:16px;border:none;background:linear-gradient(180deg,#7FB56A,#4F8B4A);color:#fff;font-family:var(--ft);font-weight:700;font-size:14px;padding:14px;border-radius:14px;cursor:pointer;box-shadow:0 6px 14px rgba(79,139,74,.3)}
.lux-suggest{margin:14px 2px 0}
.lux-measure{margin-top:8px;width:100%;background:#fff;border:1.5px dashed var(--ambar);color:var(--ambar-osc);font-weight:800;font-size:13px;padding:11px;border-radius:12px;cursor:pointer}
/* recordatorios (notificaciones) */
.notif-cta{display:flex;gap:12px;align-items:center;background:#E7F0FB;border:1px solid #C3D8EF;border-radius:16px;padding:12px 14px;margin-top:14px}
.notif-cta .nc-tx{flex:1;font-size:12.5px;color:#2F5B8A;line-height:1.4;font-weight:700}
.notif-cta button{flex:0 0 auto;border:1.5px solid #B8D2EC;background:#fff;color:#3B6FB0;font-family:var(--ft);font-weight:700;font-size:12px;padding:9px 12px;border-radius:11px;cursor:pointer;white-space:nowrap}
.diag-up{display:block;text-align:center;border:2px dashed var(--verde);background:var(--verde-bg);color:var(--verde-osc);font-family:var(--ft);font-weight:700;font-size:14px;padding:22px;border-radius:16px;cursor:pointer;margin-top:6px}
.diag-prev{height:180px;border-radius:14px;margin-top:12px;background-size:cover;background-position:center;border:1px solid var(--linea)}
.diag-result{margin-top:12px}
.diag-loading{text-align:center;color:var(--tenue);font-weight:700;padding:16px}
.diag-card{background:var(--card);border:1px solid var(--linea);border-left:4px solid var(--verde);border-radius:14px;padding:14px;box-shadow:var(--sombra-sm)}
.diag-card.warn{border-left-color:var(--terracota);background:#FDF4EF}
.diag-card-h{font-family:var(--ft);font-weight:700;font-size:15px;color:var(--tierra)}
.diag-card-sub{font-size:11.5px;font-weight:800;color:var(--tenue);text-transform:uppercase;letter-spacing:.3px;margin:3px 0 8px}
.diag-card-b{font-size:13px;color:var(--tierra-2);line-height:1.55}
.diag-rich h4{font-family:var(--ft);font-size:13.5px;color:var(--verde-osc);margin:12px 0 4px}
.diag-rich strong{color:var(--tierra)}
.diag-rich br+br{content:'';display:block;height:4px}
.diag-manual{margin-top:18px}
.dm-h{font-family:var(--ft);font-weight:700;font-size:13px;color:var(--tierra);margin-bottom:9px}
.dm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dm-btn{border:1.5px solid var(--linea);background:#fff;color:var(--tierra-2);font-weight:700;font-size:12.5px;padding:12px 8px;border-radius:12px;cursor:pointer;text-align:center}
.lux-box{border-radius:18px;overflow:hidden;background:#000;aspect-ratio:4/3;margin-top:8px;box-shadow:var(--sombra)}
#lux-video{width:100%;height:100%;object-fit:cover;display:block}
.lux-reading{font-family:var(--ft);font-weight:700;font-size:30px;color:var(--tierra);text-align:center;margin-top:12px}
.lux-pill{text-align:center;color:#fff;font-weight:800;font-size:14px;padding:10px 16px;border-radius:999px;margin:10px auto 0;max-width:280px;background:var(--tenue)}
.lux-desc{text-align:center;font-size:13px;color:var(--tierra-2);line-height:1.5;margin:10px 8px 0}
/* radar heladas + lluvia + lote */
.radar-banner{background:#E7F0FB;border:1px solid #C3D8EF;color:#2F5B8A;border-radius:14px;padding:12px 14px;font-size:12.5px;line-height:1.5;margin-top:14px}
.rain-row{display:flex;align-items:center;gap:10px;margin-top:10px}
.rain-btn{border:1.5px solid #B8D2EC;background:#fff;color:#3B6FB0;font-family:var(--ft);font-weight:700;font-size:12.5px;padding:11px;border-radius:12px;cursor:pointer}
.rain-btn.wide{width:100%}
.rain-on{flex:1;font-size:12.5px;font-weight:800;color:#3B6FB0;background:#E7F0FB;border-radius:10px;padding:9px 12px}
.batch-btn{width:100%;border:1.5px solid #B8D2EC;background:#E7F0FB;color:#3B6FB0;font-family:var(--ft);font-weight:700;font-size:13px;padding:12px;border-radius:12px;cursor:pointer;margin-bottom:12px}
/* calendario: toggle texto + secciones plegables */
.vbtn.tx{width:auto;padding:0 12px;font-size:12px;font-weight:800;font-family:var(--ft)}
.calsec{border:1px solid var(--linea);border-radius:14px;background:#fff;box-shadow:var(--sombra-sm);margin-top:12px;padding:13px 15px}
.calsec>summary{cursor:pointer;font-family:var(--ft);font-weight:700;font-size:13.5px;color:var(--tierra);list-style:none;display:flex;align-items:center;gap:8px}
.calsec>summary::-webkit-details-marker{display:none}
.calsec>summary::after{content:'▾';margin-left:auto;color:var(--tenue)}
.calsec[open]>summary::after{content:'▴'}
.cs-badge{font-size:11px;font-weight:800;color:var(--ambar-osc);background:var(--crema-2);border-radius:999px;padding:2px 9px}
.wx-auto{background:var(--verde-bg);border:none;color:var(--verde-osc);font-weight:800;font-size:12px;padding:8px 13px;border-radius:999px;cursor:pointer}
/* vista mensual */
.mnav{display:flex;align-items:center;justify-content:space-between;margin:8px 0 10px}
.mnav b{font-family:var(--ft);color:var(--tierra);font-size:16px}
.mnav button{background:#fff;border:1px solid var(--linea);border-radius:10px;width:38px;height:38px;font-size:18px;cursor:pointer;color:var(--tierra)}
.mhead{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px}
.mhead span{text-align:center;font-size:11px;font-weight:800;color:var(--tenue)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.mcell{aspect-ratio:1;border:1px solid var(--linea);border-radius:11px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.mcell.out{opacity:.38}
.mcell.tod{border-color:var(--ambar);background:#FDF3DC;box-shadow:0 3px 8px rgba(198,135,26,.2)}
.mcell .mnum{font-family:var(--ft);font-weight:700;font-size:14px;color:var(--tierra)}
.mcell .mmoon{font-size:15px;line-height:1}
/* impresión / PDF */
#print-area{display:none}
@media print{
 body{background:#fff}
 .app,.toast,.menu,.fab,.nav{display:none!important}
 #print-area{display:block!important;padding:6px;font-family:'Nunito',system-ui,sans-serif;color:#222}
 .pr-h{border-bottom:3px solid #E4A62C;padding-bottom:10px;margin-bottom:14px}
 .pr-logo{color:#4F8B4A;font-weight:800;font-size:13px}
 .pr-title{font-size:26px;font-weight:800;color:#5B3A22;margin-top:3px}
 .pr-sci{font-style:italic;color:#666;font-size:13px;margin-top:2px}
 #print-area h3{color:#3F7A3B;margin:16px 0 6px;font-size:14px}
 .pr-t{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:4px}
 .pr-t td,.pr-t th{border:1px solid #ddd;padding:6px 8px;text-align:left;vertical-align:top}
 .pr-t th{background:#F2EDE0;font-size:11px}
 .pr-t td:first-child{font-weight:700;color:#5B3A22}
 .pr-f{margin-top:20px;padding-top:10px;border-top:1px solid #ddd;font-size:11px;color:#3F7A3B;font-weight:700}
}
.fchip.drop{display:inline-flex;align-items:center;gap:5px}
.filter-drop{border:1px solid var(--linea);border-radius:13px;background:#fff;box-shadow:var(--sombra-sm);overflow:hidden;margin:-2px 2px 14px}
.fd-item{display:flex;align-items:center;gap:9px;padding:11px 13px;font-size:12.5px;font-weight:700;color:var(--tierra-2);cursor:pointer;border-top:1px solid var(--linea)}
.fd-item:first-child{border-top:none}
.fd-item:active{background:var(--crema-2)}
.fd-item.on{background:#FDF3DC;color:var(--ambar-osc)}
.fd-item.loc.on{background:var(--verde-bg);color:var(--verde-osc)}
.fd-dot{flex:0 0 auto;width:11px;height:11px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.fd-emj{flex:0 0 auto;width:16px;text-align:center}
.fd-count{margin-left:auto;font-size:11px;font-weight:800;color:var(--tenue);background:var(--crema-2);border-radius:999px;padding:2px 9px}
/* transición suave */
.view-anim{animation:viewIn .30s cubic-bezier(.22,.61,.36,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
/* onboarding / bienvenida */
.welcome{padding:14px 4px 20px}
.wel-hero{text-align:center;padding:22px 16px 8px}
.wel-mark{width:104px;height:104px;margin:0 auto 6px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#FBF0D4,#F6E3B4);display:flex;align-items:center;justify-content:center;box-shadow:var(--sombra-sm)}
.wel-title{font-family:var(--ft);font-weight:700;font-size:24px;color:var(--tierra);margin-top:10px}
.wel-sub{font-size:14px;color:var(--tenue);font-weight:700;margin-top:4px}
.wel-cards{display:flex;flex-direction:column;gap:11px;margin:20px 2px 22px}
.wel-c{display:flex;gap:13px;align-items:flex-start;background:var(--card);border:1px solid var(--linea);border-radius:16px;padding:14px 15px;box-shadow:var(--sombra-sm)}
.wel-e{font-size:26px;line-height:1;flex:0 0 auto;width:44px;height:44px;border-radius:13px;background:var(--crema-2);display:flex;align-items:center;justify-content:center}
.wel-ct{font-family:var(--ft);font-weight:700;font-size:15px;color:var(--tierra)}
.wel-cx{font-size:12.5px;color:var(--tierra-2);line-height:1.5;margin-top:3px}
.wel-foot{text-align:center;font-size:12px;color:var(--tenue);margin:12px 0 0}
/* cosecha */
.harvest{margin-top:10px;background:var(--crema-2);border:1px solid #F0DFB6;border-radius:12px;padding:11px 13px;font-family:var(--ft);font-weight:700;font-size:14px;color:var(--tierra)}
.harvest.ready{background:var(--verde-bg);border-color:#CFE2D3;color:var(--verde-osc)}
/* mini-diario */
.diary-add{display:flex;gap:8px;align-items:center}
.diary-add input{flex:1;min-width:0;padding:11px 12px;border:1.5px solid var(--linea);border-radius:12px;font-family:var(--fb);font-size:14px;background:#fff;color:var(--texto);outline:none}
.diary-add input:focus{border-color:var(--ambar)}
.diary-cam{flex:0 0 auto;width:44px;height:44px;border:1.5px solid var(--linea);border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}
.diary-add button{flex:0 0 auto;border:none;background:linear-gradient(180deg,var(--ambar),var(--ambar-osc));color:#3a2600;font-family:var(--ft);font-weight:700;font-size:13px;padding:0 15px;height:44px;border-radius:12px;cursor:pointer}
.diary-prev{height:120px;border-radius:12px;margin-top:10px;background-size:cover;background-position:center;border:1px solid var(--linea)}
.diary-list{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.diary-e{display:flex;gap:11px;align-items:flex-start;background:var(--crema-2);border-radius:13px;padding:10px 11px;position:relative}
.diary-img{flex:0 0 auto;width:52px;height:52px;border-radius:10px;background-size:cover;background-position:center}
.diary-body{flex:1;min-width:0;padding-right:16px}
.diary-tx{font-size:13px;color:var(--tierra);font-weight:700;line-height:1.4;word-break:break-word}
.diary-date{font-size:11px;color:var(--tenue);font-weight:700;margin-top:4px}
.diary-del{position:absolute;top:6px;right:6px;border:none;background:none;color:var(--tenue);font-size:13px;cursor:pointer;padding:2px 5px;line-height:1}
/* ubicación y luz */
.luzcard{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--linea);border-left:4px solid var(--tenue);border-radius:14px;padding:13px 14px;margin-top:14px;box-shadow:var(--sombra-sm)}
.luzcard.ok{border-left-color:var(--verde)}
.luzcard.warn{border-left-color:var(--terracota);background:#FDF4EF}
.luz-ic{font-size:22px;line-height:1;flex:0 0 auto}
.luz-h{font-family:var(--ft);font-weight:700;font-size:13.5px;color:var(--tierra);margin-bottom:3px}
.luz-m{font-size:12.5px;color:var(--tierra-2);line-height:1.5}
/* nav activo */
.nav .on .ic{transform:translateY(-1px)}
/* ---------- inicio ---------- */
.home-hero{position:relative;overflow:hidden;border-radius:22px;padding:20px 18px;margin-top:8px;color:#fff;background:linear-gradient(135deg,#2E6E3F 0%,#3F7A3B 45%,#5B7A2E 100%);box-shadow:var(--sombra)}
.home-hero .hh-stars{position:absolute;inset:0;pointer-events:none;opacity:.5;background-image:radial-gradient(1.5px 1.5px at 20% 30%,rgba(255,255,255,.7),transparent),radial-gradient(1.3px 1.3px at 70% 22%,rgba(255,255,255,.55),transparent),radial-gradient(1.2px 1.2px at 85% 60%,rgba(255,255,255,.5),transparent),radial-gradient(1.2px 1.2px at 35% 70%,rgba(255,255,255,.45),transparent)}
.hh-row{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:10px}
.hh-hi{font-family:var(--ft);font-weight:700;font-size:15px;opacity:.95}
.hh-moon{background:rgba(255,255,255,.18);border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:800;white-space:nowrap}
.hh-big{position:relative;z-index:1;font-family:var(--ft);font-weight:700;font-size:26px;margin:12px 0 4px;line-height:1.15}
.hh-meta{position:relative;z-index:1;font-size:12.5px;font-weight:700;opacity:.9}
.hstats{display:flex;gap:10px;margin:14px 0 6px}
.hstat{flex:1;background:var(--card);border:1px solid var(--linea);border-radius:16px;padding:14px 8px;text-align:center;box-shadow:var(--sombra-sm);cursor:pointer}
.hstat .hs-n{font-family:var(--ft);font-weight:700;font-size:24px;color:var(--tierra);line-height:1}
.hstat .hs-l{font-size:11px;font-weight:800;color:var(--tenue);margin-top:5px}
.hstat.hot{border-color:#EBB9A8;background:#FBE3D6}.hstat.hot .hs-n{color:var(--terracota)}
.hstat.warn{border-color:#EFD3A6;background:#FDF3DC}.hstat.warn .hs-n{color:var(--ambar-osc)}
.home-h3{font-family:var(--ft);font-weight:700;font-size:15px;color:var(--tierra);margin:18px 2px 10px}
.att{display:flex;align-items:center;gap:12px;position:relative;overflow:hidden;background:var(--card);border:1px solid var(--linea);border-radius:16px;padding:11px 12px;margin-bottom:10px;box-shadow:var(--sombra-sm);cursor:pointer}
.att::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--acc,transparent)}
.att-th{width:46px;height:46px;border-radius:13px;flex:0 0 auto;background:linear-gradient(160deg,#F6DFA6,#D79A54);display:flex;align-items:center;justify-content:center;overflow:hidden}
.att-b{flex:1;min-width:0}
.att-n{font-family:var(--ft);font-weight:700;font-size:15px;color:var(--tierra);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-t{font-size:12px;font-weight:700;color:var(--tierra-2);margin-top:2px}
.att-go{color:var(--tenue);font-size:22px;font-weight:800;padding:0 4px}
.home-allok{background:var(--verde-bg);border:1px solid #CFE2D3;border-radius:16px;padding:16px;font-size:13.5px;color:var(--verde-osc);line-height:1.5;margin-top:14px}
.home-tip{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(135deg,#20264A,#3B2E5A);color:#fff;border-radius:16px;padding:14px 15px;margin-top:16px;box-shadow:var(--sombra-sm)}
.ht-ic{font-size:22px;line-height:1;flex:0 0 auto}
.ht-h{font-family:var(--ft);font-weight:700;font-size:13px;opacity:.9;margin-bottom:3px}
.ht-t{font-size:12.5px;line-height:1.55;opacity:.95}
.home-actions{display:flex;gap:10px;margin:16px 0 4px}
.home-actions button{flex:1;border:1.5px solid var(--linea);background:#fff;border-radius:14px;padding:13px;font-family:var(--ft);font-weight:700;font-size:13.5px;color:var(--tierra);cursor:pointer;box-shadow:var(--sombra-sm)}
.home-actions .ha-primary{border:none;background:linear-gradient(180deg,var(--ambar),var(--ambar-osc));color:#3a2600;box-shadow:0 6px 14px rgba(198,135,26,.35)}
.list-status{display:flex;gap:8px;margin:2px 2px 12px;flex-wrap:wrap}
.ls-pill{font-size:12px;font-weight:800;padding:7px 12px;border-radius:999px}
.ls-pill.warn{background:#FBE3D6;color:var(--terracota)}
.ls-pill.ok{background:var(--verde-bg);color:var(--verde-osc)}
.ls-pill.fire{background:#FDE7CC;color:#B5622F}

/* form */
.field{margin-bottom:16px}
.field label{display:block;font-weight:800;font-size:13px;color:var(--tierra);margin-bottom:7px}
.field input, .field select{width:100%;padding:12px 13px;border:1.5px solid var(--linea);border-radius:13px;
  font-family:var(--fb);font-size:15px;background:#fff;color:var(--texto)}
.field input:focus,.field select:focus{outline:none;border-color:var(--ambar)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{flex:1;min-width:calc(50% - 4px);text-align:center;padding:12px 8px;border:1.5px solid var(--linea);
  border-radius:13px;background:#fff;font-weight:800;font-size:13px;color:var(--tierra-2);cursor:pointer;transition:.12s}
.opt .em{display:block;font-size:20px;margin-bottom:3px}
.opt.sel{border-color:var(--ambar);background:#FDF3DC;color:var(--ambar-osc);box-shadow:0 3px 10px rgba(198,135,26,.2)}
.hint{font-size:11.5px;color:var(--tenue);margin-top:6px}
.btn-primary{width:100%;background:linear-gradient(180deg,var(--ambar),var(--ambar-osc));color:#3a2600;
  border:none;font-family:var(--ft);font-weight:700;font-size:15px;padding:14px;border-radius:14px;
  box-shadow:0 6px 14px rgba(198,135,26,.35);cursor:pointer;margin-top:6px}
.btn-ghost{width:100%;background:none;border:none;color:var(--terracota);font-weight:800;font-size:13px;
  padding:12px;cursor:pointer;margin-top:2px}

/* ficha */
.hero{position:relative;border-radius:22px;overflow:hidden;height:170px;margin-top:8px;
  background:linear-gradient(160deg,#F6DFA6,#E9BE73 46%,#D79A54);box-shadow:var(--sombra-sm)}
.hero .sun{position:absolute;right:-30px;top:-30px;width:150px;height:150px;opacity:.32}
.hero .plant{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%)}
.hero .badge{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.92);color:var(--terracota);
  font-weight:800;font-size:11px;padding:6px 11px;border-radius:999px}
.hero.photo{background-size:cover;background-position:center}
.hero .hero-ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28),rgba(0,0,0,0) 45%,rgba(0,0,0,.12));z-index:1}
.hero .badge{z-index:2}
.hero-cam{position:absolute;right:12px;bottom:12px;z-index:3;background:rgba(255,255,255,.94);width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;box-shadow:var(--sombra-sm)}
.hero-rm{position:absolute;right:12px;top:12px;z-index:3;background:rgba(0,0,0,.45);color:#fff;border:none;width:30px;height:30px;border-radius:50%;font-size:13px;cursor:pointer}
.statuscard{background:var(--card);border:1px solid var(--linea);border-radius:16px;padding:13px 15px;margin-top:14px;box-shadow:var(--sombra-sm)}
.st-line{font-weight:800;font-size:13px;color:var(--tierra);margin-bottom:11px}
.st-line.warn{color:var(--terracota)}
.st-line.ok{color:var(--verde-osc)}
.st-title{font-family:var(--ft);font-weight:700;font-size:13.5px;color:var(--tierra);margin-bottom:10px}
.st-grid{display:flex;gap:10px;margin-bottom:12px}
.st-grid>div{flex:1;background:var(--crema-2);border-radius:11px;padding:9px 11px}
.st-k{font-size:10px;font-weight:800;color:var(--tenue);text-transform:uppercase;letter-spacing:.3px}
.st-v{font-family:var(--ft);font-weight:700;font-size:13px;color:var(--tierra);margin-top:3px;line-height:1.25}
.st-v.warn{color:var(--terracota)}
.st-v.muted{color:var(--tenue);font-weight:700;font-size:12px}
.st-btns{display:flex;gap:8px}
.st-btns button{flex:1;border:1.5px solid var(--linea);background:#fff;border-radius:11px;padding:10px;font-family:var(--ft);font-weight:700;font-size:12.5px;color:var(--tierra);cursor:pointer}
.st-btns button.done{background:var(--verde-bg);border-color:var(--verde);color:var(--verde-osc)}
.name-row{margin:14px 2px 2px}
.pname{font-family:var(--ft);font-weight:700;font-size:22px;color:var(--tierra)}
.psci{font-style:italic;color:var(--tenue);font-size:13px}
.chips{display:flex;gap:8px;margin:12px 0 2px;flex-wrap:wrap}
.chip{background:#fff;border:1px solid var(--linea);border-radius:999px;padding:8px 11px;font-size:12px;
  font-weight:700;color:var(--tierra-2);box-shadow:var(--sombra-sm)}
.card{background:var(--card);border:1px solid var(--linea);border-radius:20px;padding:15px;margin-top:14px;box-shadow:var(--sombra-sm)}
.card h3{font-family:var(--ft);margin:0 0 4px;font-size:14.5px;color:var(--tierra);font-weight:700}
.muted{color:var(--tenue);font-size:12.5px;margin:0}
.mix{display:flex;height:14px;border-radius:8px;overflow:hidden;margin:12px 0 9px}
.mix i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11px;color:var(--tierra-2);font-weight:700}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}
.cost{font-family:var(--ft);font-weight:700;color:var(--tierra);font-size:16px;margin:12px 0 11px}
.cost small{font-weight:700;color:var(--tenue);font-size:11px}
.cta{width:100%;background:linear-gradient(180deg,var(--ambar),var(--ambar-osc));color:#3a2600;border:none;
  font-family:var(--ft);font-weight:700;font-size:13.5px;padding:12px;border-radius:13px;
  box-shadow:0 6px 14px rgba(198,135,26,.35);cursor:pointer;display:flex;gap:7px;align-items:center;justify-content:center}
.rem{display:flex;gap:11px;align-items:center;padding:10px 0;border-bottom:1px solid var(--linea)}
.rem:last-child{border-bottom:none}
.rem .ic{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto}
.rem .tx{flex:1}.rem .t1{font-weight:800;font-size:13px;color:var(--tierra)}.rem .t2{font-size:11.5px;color:var(--tenue)}
.rem .when{font-size:11px;font-weight:800;color:var(--verde-osc);white-space:nowrap}
.rem.alert{background:#FDF1EA;border-radius:12px;padding:9px 10px;border:1px solid #F3D9CB;margin-top:4px}
.rem.alert .ic{background:#FBE3D6;color:var(--terracota)}.rem.alert .when{color:var(--terracota)}
.note-adj{background:var(--verde-bg);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:12px;color:var(--verde-osc);font-weight:700}
.del{width:100%;background:none;border:1.5px solid #E7C4B7;color:var(--terracota);font-weight:800;font-size:13px;
  padding:11px;border-radius:12px;cursor:pointer;margin-top:16px}

/* nav */
.nav{position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--linea);
  display:flex;justify-content:space-around;padding:9px 6px 13px;padding-bottom:calc(13px + env(safe-area-inset-bottom,0px));z-index:20}
.nav div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:800;color:var(--tenue);cursor:pointer}
.nav .on{color:var(--ambar-osc)}.nav .ic{font-size:18px}

/* fab */
.fab{position:absolute;right:18px;bottom:74px;width:56px;height:56px;border-radius:50%;
  background:linear-gradient(180deg,var(--terracota),var(--terracota-osc));color:#fff;border:none;font-size:28px;
  box-shadow:0 8px 20px rgba(169,74,38,.4);cursor:pointer;z-index:21;line-height:1}

/* toast */
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--tierra);color:#fff;
  padding:11px 18px;border-radius:12px;font-size:13px;font-weight:700;box-shadow:var(--sombra);opacity:0;
  transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.menu{position:absolute;right:14px;top:56px;background:#fff;border:1px solid var(--linea);border-radius:14px;
  box-shadow:var(--sombra);z-index:30;overflow:hidden;display:none}
.menu.show{display:block}
.menu button{display:block;width:100%;text-align:left;background:none;border:none;padding:12px 16px;font-size:13px;
  font-weight:700;color:var(--tierra);cursor:pointer;white-space:nowrap}
.menu button:hover{background:var(--crema-2)}
.mark{display:inline-block;width:26px;height:26px}
/* buscador / selector / calendario */
.results{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.res{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--linea);border-radius:12px;background:#fff;cursor:pointer}
.res:active{background:var(--crema-2)}
.res .rn{font-weight:700;font-size:13.5px;color:var(--tierra)}
.res .rs{font-style:italic;font-size:11px;color:var(--tenue)}
.res .rt{margin-left:auto;font-size:10px;font-weight:800;color:var(--ambar-osc);background:#FBEFCD;padding:3px 7px;border-radius:999px;white-space:nowrap}
.chosen{margin-top:8px;display:flex;align-items:center;gap:10px;padding:11px;border:1.5px solid var(--verde);background:var(--verde-bg);border-radius:12px}
.chosen .cn{font-weight:800;color:var(--verde-osc);font-size:14px}
.chosen .chg{margin-left:auto;font-size:12px;font-weight:800;color:var(--terracota);cursor:pointer;background:none;border:none}
.assist{margin-top:10px;width:100%;background:none;border:1.5px dashed var(--ambar);color:var(--ambar-osc);font-weight:800;font-size:13px;padding:10px;border-radius:12px;cursor:pointer}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--linea);background:#fff;font-size:22px;font-weight:800;color:var(--tierra);cursor:pointer;line-height:1}
.stepper span{font-family:var(--ft);font-weight:700;font-size:20px;color:var(--tierra);min-width:28px;text-align:center}
.summary{display:flex;flex-wrap:wrap;gap:7px;margin:2px 2px 16px}
.sumchip{background:#fff;border:1px solid var(--linea);border-radius:999px;padding:6px 11px;font-size:11.5px;font-weight:800;color:var(--tierra-2);box-shadow:var(--sombra-sm)}
.qcard{margin-top:8px;background:#fff;border:1px solid var(--linea);border-radius:14px;padding:14px}
.qcard .q{font-weight:800;color:var(--tierra);font-size:14px;margin-bottom:12px}
.qbtns{display:flex;gap:8px}
.qbtns button{flex:1;padding:11px;border-radius:11px;border:1.5px solid var(--linea);background:#fff;font-weight:800;cursor:pointer;font-family:var(--fb);font-size:14px}
.qbtns .si{border-color:var(--verde);color:var(--verde-osc)}
.qbtns .no{border-color:var(--linea);color:var(--tierra-2)}
.cal-cat{margin-top:16px}
.cal-cat h3{font-family:var(--ft);font-size:14px;color:var(--tierra);margin:0 0 8px}
.cal-row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--linea);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.cal-row .cn{font-weight:800;font-size:13px;color:var(--tierra)}
.cal-row .cx{font-size:12px;color:var(--tenue);font-weight:700}
.cal-row .cd{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--verde-osc);white-space:nowrap}
.cal-row .cd.warn{color:var(--terracota)}
/* calendario lunar */
.moon-hero{position:relative;overflow:hidden;border-radius:20px;padding:16px;margin-top:10px;color:#fff;
  background:linear-gradient(135deg,#20264A,#3B2E5A 55%,#5A3E6B);box-shadow:var(--sombra)}
.moon-hero .stars{position:absolute;inset:0;pointer-events:none;background-image:
  radial-gradient(1.6px 1.6px at 18% 28%,rgba(255,255,255,.85),transparent),
  radial-gradient(1.4px 1.4px at 72% 20%,rgba(255,255,255,.6),transparent),
  radial-gradient(1.2px 1.2px at 86% 62%,rgba(255,255,255,.7),transparent),
  radial-gradient(1.2px 1.2px at 38% 72%,rgba(255,255,255,.5),transparent),
  radial-gradient(1.5px 1.5px at 58% 46%,rgba(255,255,255,.5),transparent),
  radial-gradient(1.2px 1.2px at 30% 52%,rgba(255,255,255,.45),transparent)}
.moon-hero .mn{position:relative;z-index:1;display:flex;align-items:center;gap:14px}
.moon-hero .mem{font-size:46px;line-height:1;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.moon-hero .mtitle{font-family:var(--ft);font-weight:700;font-size:19px}
.moon-hero .msub{font-size:12px;opacity:.85}
.moon-hero .mgood{position:relative;z-index:1;margin-top:12px;background:rgba(255,255,255,.15);
  border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.5}
.wknav{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.wknav b{font-family:var(--ft);color:var(--tierra);font-size:14px}
.wknav button{background:#fff;border:1px solid var(--linea);border-radius:10px;width:34px;height:34px;font-size:16px;cursor:pointer;color:var(--tierra)}
.wk{display:flex;gap:6px;margin-top:10px}
.wk .d{flex:1;text-align:center;padding:8px 2px;border-radius:12px;border:1px solid var(--linea);background:#fff;cursor:pointer;transition:.12s}
.wk .d.sel{border-color:var(--ambar);background:#FDF3DC;box-shadow:0 3px 10px rgba(198,135,26,.2)}
.wk .d.today .dd{color:var(--terracota)}
.wk .dl{font-size:9.5px;font-weight:800;color:var(--tenue);text-transform:uppercase}
.wk .dd{font-weight:800;font-size:15px;color:var(--tierra);margin:1px 0}
.wk .dm{font-size:14px}
.daybox{margin-top:14px;background:#fff;border:1px solid var(--linea);border-radius:16px;padding:14px;box-shadow:var(--sombra-sm)}
.daybox h4{font-family:var(--ft);margin:0 0 4px;font-size:14px;color:var(--tierra)}
.dolist{margin:8px 0 0;padding:0;list-style:none}
.dolist li{display:flex;gap:9px;font-size:12.5px;color:var(--tierra-2);padding:4px 0;align-items:flex-start;line-height:1.4}
.dolist li::before{content:'';flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--verde);margin-top:5px}
.dono{font-size:11.5px;color:var(--terracota);font-weight:700;margin-top:9px}
.task{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--linea);border-radius:12px;padding:11px;margin-bottom:8px;cursor:pointer}
.task .ck{width:24px;height:24px;border-radius:7px;border:2px solid var(--linea);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:900}
.task.done .ck{background:var(--verde);border-color:var(--verde)}
.task.done .tt{text-decoration:line-through;color:var(--tenue)}
.task .tt{font-weight:800;font-size:13px;color:var(--tierra)}
.task .ts{font-size:11.5px;color:var(--tenue)}
.tip-nat{background:var(--verde-bg);border-radius:12px;padding:11px 13px;margin-top:14px;font-size:12px;color:var(--verde-osc);font-weight:700;line-height:1.5}
.cd.ok{color:var(--verde-osc)}
.ptask{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:11px 13px;margin-bottom:10px;box-shadow:var(--sombra-sm)}
.ptask-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.ptask-thumb{width:32px;height:32px;border-radius:9px;flex:0 0 auto;background:linear-gradient(160deg,#F6DFA6,#D79A54);display:flex;align-items:center;justify-content:center;overflow:hidden}
.ptask-name{font-family:var(--ft);font-weight:700;font-size:14px;color:var(--tierra)}
.act{display:flex;align-items:center;gap:10px;padding:9px 0;cursor:pointer;border-top:1px dashed var(--linea)}
.ptask-head + .act{border-top:1px solid var(--linea);margin-top:4px}
.act .ck{width:22px;height:22px;border-radius:6px;border:2px solid var(--linea);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:900}
.act.done .ck{background:var(--verde);border-color:var(--verde)}
.act.done .at{text-decoration:line-through;color:var(--tenue)}
.act .at{flex:1;font-weight:800;font-size:13px;color:var(--tierra)}
.act .asub{font-weight:700;color:var(--tenue);font-size:11px}
.act .as{font-size:11px;font-weight:800;color:var(--verde-osc);white-space:nowrap}
.act .as.warn{color:var(--terracota)}
.act .as.ok{color:var(--verde-osc)}
.streak{display:inline-flex;align-items:center;gap:6px;background:#FDE7CC;color:#B5622F;font-weight:800;font-size:12px;padding:6px 12px;border-radius:999px;margin:2px 2px 6px}
.moon-hero .el-badge{position:relative;z-index:1;display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.16);border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:800;margin-top:10px}
.wk .de{font-size:11px;margin-top:2px}
.wx{background:#fff;border:1px solid var(--linea);border-radius:16px;padding:12px;margin-top:14px;box-shadow:var(--sombra-sm)}
.wx-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.wx-head span{font-family:var(--ft);font-weight:700;font-size:13.5px;color:var(--tierra)}
.wx-head button{background:var(--verde-bg);border:none;color:var(--verde-osc);font-weight:800;font-size:11.5px;padding:6px 11px;border-radius:999px;cursor:pointer}
.wx-chips{display:flex;gap:6px;flex-wrap:wrap}
.wxc{flex:1;min-width:calc(50% - 4px);border:1.5px solid var(--linea);background:#fff;border-radius:11px;padding:9px 6px;font-weight:800;font-size:12px;color:var(--tierra-2);cursor:pointer}
.wxc.on{border-color:var(--ambar);background:#FDF3DC;color:var(--ambar-osc)}
.wx-note{margin-top:10px;background:#E7F0FB;color:#3B6FB0;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:700;line-height:1.4}
.ephem{display:flex;gap:8px;margin-top:10px}
.ephem .e{flex:1;background:#fff;border:1px solid var(--linea);border-radius:14px;padding:10px 11px;box-shadow:var(--sombra-sm);display:flex;align-items:center;gap:9px}
.ephem .ee{font-size:22px;line-height:1}
.ephem .et{font-size:10px;color:var(--tenue);font-weight:800;text-transform:uppercase}
.ephem .ed{font-family:var(--ft);font-weight:700;font-size:12.5px;color:var(--tierra)}
.why{margin-top:11px}
.why summary{cursor:pointer;font-weight:800;font-size:12px;color:var(--ambar-osc);list-style:none}
.why summary::-webkit-details-marker{display:none}
.why summary::before{content:'💡 ¿Por qué se hace así?'}
.why[open] summary::before{content:'💡 ¿Por qué se hace así? ▲'}
.why p{margin:9px 0 0;font-size:12px;color:var(--tierra-2);line-height:1.55;background:var(--crema-2);border-radius:10px;padding:11px}
.reto{background:linear-gradient(135deg,#2E6E3F,#4F8B4A);color:#fff;border-radius:18px;padding:15px;margin-top:14px;box-shadow:var(--sombra-sm)}
.reto .rl{font-size:11px;font-weight:800;opacity:.9;text-transform:uppercase;letter-spacing:.4px}
.reto .rt{font-family:var(--ft);font-weight:700;font-size:15px;margin:5px 0 12px;line-height:1.3}
.reto-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid rgba(255,255,255,.18)}
.reto-row:first-of-type{border-top:none}
.reto .rr-t{flex:1;font-size:13px;font-weight:700;line-height:1.3}
.reto-row button{background:#fff;color:var(--verde-osc);border:none;font-family:var(--ft);font-weight:700;font-size:12px;padding:8px 14px;border-radius:10px;cursor:pointer;white-space:nowrap}
.rr-done{font-size:12px;font-weight:800;opacity:.92;white-space:nowrap}

/* ============================================================
   SAPHI V3 · SISTEMA PROVISIONAL "RAÍZ INTELIGENTE"
   Todos los elementos de marca editables viven en estas variables.
   Al recibir la identidad final: actualizar tokens y .brand-slot.
   ============================================================ */
:root{
  /* Marca provisional: sustituir estos 8 tokens, no cada pantalla */
  --brand-root:#163D34;
  --brand-leaf:#2D7358;
  --brand-leaf-soft:#E3EFE8;
  --brand-sun:#E7B13D;
  --brand-earth:#B75035;
  --brand-sky:#356A78;
  --brand-ink:#172A24;
  --brand-paper:#F4F3EC;

  /* Tokens semánticos */
  --crema:var(--brand-paper);
  --crema-2:#EAEAE2;
  --ambar:var(--brand-sun);
  --ambar-osc:#855A00;
  --terracota:var(--brand-earth);
  --terracota-osc:#8F3B28;
  --tierra:var(--brand-root);
  --tierra-2:#3F574F;
  --verde:var(--brand-leaf);
  --verde-osc:#174E3B;
  --verde-bg:var(--brand-leaf-soft);
  --texto:var(--brand-ink);
  --tenue:#607169;
  --card:#FFFFFF;
  --linea:#D7DDD6;
  --linea-fuerte:#BBC7BF;
  --info:var(--brand-sky);
  --alerta:var(--brand-earth);
  --sombra:0 22px 58px rgba(22,61,52,.13);
  --sombra-sm:0 8px 24px rgba(22,61,52,.075);

  /* Tipografía provisional */
  --font-ui:'Manrope',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --font-botanical:'Source Serif 4',Georgia,serif;
  --ft:var(--font-ui);
  --fb:var(--font-ui);

  /* Forma y ritmo provisional */
  --radio-sm:12px;
  --radio-md:18px;
  --radio-lg:26px;
  --touch:48px;
  --content-max:1120px;
}

html{background:#DDE3DD}
body{
  background:#DDE3DD;
  color:var(--texto);
  font-size:16px;
  line-height:1.5;
  align-items:center;
  padding:0;
}
button,input,select,textarea{font:inherit}
button{-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,[tabindex]:focus-visible{
  outline:3px solid rgba(231,178,63,.78)!important;
  outline-offset:3px;
}

.app{
  max-width:var(--content-max);
  background:var(--crema);
  box-shadow:0 30px 90px rgba(24,62,52,.18);
  border:1px solid rgba(24,62,52,.08);
}
.topbar{
  min-height:70px;
  padding:13px 18px 11px;
  padding-top:calc(13px + env(safe-area-inset-top,0px));
  background:rgba(246,245,239,.97);
  border-bottom:1px solid rgba(24,62,52,.08);
  backdrop-filter:blur(16px);
}
.brand{gap:11px}
.brand .bn{font-size:21px;letter-spacing:-.45px;color:var(--tierra)}
.brand-slot{
  width:36px;
  height:36px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  border-radius:11px 11px 11px 4px;
  background:var(--tierra);
  color:#fff;
  font-family:var(--font-botanical);
  font-size:22px;
  font-style:italic;
  font-weight:600;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.12);
}
.brand-copy{display:flex;flex-direction:column;line-height:1.05}
.brand-caption{margin-top:4px;font-size:9px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--tenue)}
.tb-right{gap:7px}
.iconbtn{
  width:42px;
  height:42px;
  min-height:42px;
  border-radius:13px;
  background:#fff;
  box-shadow:none;
  font-size:14px;
  letter-spacing:1px;
}
.back{min-width:42px;min-height:42px;border-radius:12px;font-size:29px;line-height:1}
.back:hover{background:#fff}
.chip-region{font-size:12px;padding:8px 11px;box-shadow:none}

.content{
  padding:12px 18px 118px;
  scrollbar-width:none;
  overscroll-behavior:contain;
}
h2.sc{
  margin:18px 2px 5px;
  font-size:26px;
  line-height:1.18;
  letter-spacing:-.55px;
}
.sub{font-size:14px;line-height:1.5;margin-bottom:18px;color:var(--tenue)}
.muted{font-size:14px;line-height:1.55}

/* Inicio */
.home-shell{max-width:980px;margin:0 auto}
.home-hero{
  position:relative;
  overflow:hidden;
  margin-top:10px;
  padding:26px 24px 25px;
  min-height:184px;
  border-radius:var(--radio-lg) var(--radio-lg) var(--radio-lg) 9px;
  color:#fff;
  background:var(--brand-root);
  border:1px solid var(--brand-root);
  box-shadow:0 18px 38px rgba(24,62,52,.2);
}
.home-hero::before{
  content:'';
  position:absolute;
  right:-48px;
  bottom:-83px;
  width:290px;
  height:220px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:54% 46% 52% 48%;
  transform:rotate(-17deg);
  box-shadow:0 0 0 28px rgba(255,255,255,.035),0 0 0 58px rgba(255,255,255,.025);
}
.home-hero::after{
  content:'';
  position:absolute;
  right:42px;
  bottom:24px;
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--brand-sun);
  box-shadow:-54px -24px 0 0 rgba(255,255,255,.72),-99px 17px 0 0 rgba(255,255,255,.4);
}
.home-hero>*{position:relative;z-index:1}
.home-hero .hh-stars{display:none}
.hh-row{align-items:center}
.hh-hi{
  font-size:13px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:#D6E8DF;
}
.hh-moon{
  padding:6px 10px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.15);
  font-size:12px;
}
.hh-big{
  max-width:540px;
  margin:27px 0 8px;
  font-size:clamp(27px,5vw,36px);
  line-height:1.08;
  letter-spacing:-1px;
}
.hh-meta{font-size:14px;color:#D6E8DF;opacity:1}
.hstats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:14px 0 7px;
}
.hstat{
  min-height:112px;
  padding:15px 12px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:space-between;
  text-align:left;
  border-radius:var(--radio-md) var(--radio-md) var(--radio-md) 7px;
  box-shadow:none;
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
}
.hstat:hover{transform:translateY(-2px);border-color:#BBC5BC;box-shadow:var(--sombra-sm)}
.hstat .hs-k{font-family:var(--ft);font-size:10px;letter-spacing:.12em;color:var(--tenue)}
.hstat .hs-n{font-size:30px;letter-spacing:-1px}
.hstat .hs-l{font-size:13px;margin-top:0}
.hstat.hot{background:#FFF4EE;border-color:#EBCFC4}
.hstat.warn{background:#FFF9E8;border-color:#EADBAF}
.home-h3{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:10px;
  margin:24px 2px 12px;
  font-size:18px;
}
.home-h3 span{font-weight:800;letter-spacing:-.25px}
.home-h3 small{font-family:var(--fb);font-size:12px;font-weight:700;color:var(--tenue)}
.att{
  min-height:74px;
  padding:11px 12px 11px 15px;
  margin-bottom:9px;
  border-radius:18px;
  box-shadow:none;
  transition:border-color .18s ease,transform .18s ease,box-shadow .18s ease;
}
.att::before{width:5px}
.att:hover{transform:translateY(-1px);border-color:#BBC5BC;box-shadow:var(--sombra-sm)}
.att-th{width:50px;height:50px;border-radius:15px;background:#EDE2C8}
.att-n{font-size:15px}
.att-t{font-size:13px;color:var(--tenue)}
.home-allok{
  display:flex;
  align-items:flex-start;
  gap:13px;
  margin-top:14px;
  padding:16px;
  background:#fff;
  color:var(--tierra-2);
  border-color:var(--linea);
  font-size:14px;
}
.home-allok b{color:var(--tierra)}
.status-symbol{
  width:36px;
  height:36px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  border-radius:11px;
  background:var(--verde-bg);
  color:var(--verde-osc);
  font-family:var(--ft);
  font-size:12px;
}
.home-tip{
  padding:16px;
  margin-top:16px;
  color:var(--texto);
  background:#fff;
  border:1px solid var(--linea);
  border-left:5px solid var(--ambar);
  border-radius:18px;
  box-shadow:none;
}
.home-tip .ht-ic{
  width:30px;
  height:30px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#FFF3CD;
  color:var(--ambar-osc);
  font-family:var(--ft);
  font-size:14px;
}
.ht-h{font-size:13px;color:var(--tierra);opacity:1}
.ht-t{font-size:14px;color:var(--tierra-2);opacity:1}
.home-actions{gap:9px;margin:16px 0 4px}
.home-actions button{
  min-height:50px;
  padding:12px 14px;
  border-radius:15px;
  box-shadow:none;
  font-size:14px;
}
.home-actions button:hover{border-color:#AEBBB0;background:#FCFCF9}
.home-actions .ha-primary{
  background:var(--brand-root);
  color:#fff;
  box-shadow:none;
}
.home-actions .ha-primary:hover{
    background: var(--brand-root);
    color: #fff;
    border-color: transparent;
    filter: brightness(1.15);
}
.home-empty-steps{display:grid;gap:8px;margin:16px 0}
.home-empty-step{display:flex;align-items:flex-start;gap:12px;padding:14px;background:#fff;border:1px solid var(--linea);border-radius:var(--radio-md)}
.home-empty-step .step-dot{width:28px;height:28px;flex:0 0 auto;display:grid;place-items:center;border-radius:9px 9px 9px 3px;background:var(--verde-bg);color:var(--verde-osc);font-size:11px;font-weight:800}
.home-empty-step strong{display:block;font-size:14px;color:var(--tierra)}
.home-empty-step span{display:block;margin-top:2px;font-size:13px;line-height:1.45;color:var(--tenue)}

/* Onboarding */
.welcome{max-width:980px;margin:0 auto;padding:16px 2px 24px}
.wel-hero{position:relative;text-align:left;padding:22px 4px 16px}
.wel-kicker{
  font-family:var(--ft);
  font-size:11px;
  font-weight:700;
  letter-spacing:.16em;
  color:var(--verde);
  margin-bottom:14px;
}
.wel-mark{
  width:82px;
  height:82px;
  display:grid;
  place-items:center;
  margin:0 0 16px;
  border-radius:24px 24px 24px 8px;
  background:var(--brand-root);
  border:1px solid var(--brand-root);
  box-shadow:none;
}
.wel-mark .brand-slot{width:48px;height:48px;background:#fff;color:var(--brand-root);font-size:29px}
.wel-title{
  max-width:620px;
  margin-top:0;
  font-size:36px;
  line-height:1.08;
  letter-spacing:-1.2px;
}
.wel-sub{max-width:520px;margin-top:10px;font-size:16px;line-height:1.5;font-weight:600}
.wel-ritual{display:flex;align-items:center;gap:8px;margin-top:18px;color:var(--tierra-2);font-size:13px;font-weight:800}
.wel-ritual i{width:5px;height:5px;border-radius:50%;background:var(--brand-sun)}
.wel-cards{gap:8px;margin:24px 0}
.wel-c{
  gap:14px;
  padding:14px 15px;
  border-radius:var(--radio-md) var(--radio-md) var(--radio-md) 7px;
  box-shadow:none;
}
.wel-e{
  width:40px;
  height:40px;
  border-radius:12px;
  background:var(--verde-bg);
  color:var(--verde-osc);
  color:#fff;
  font-family:var(--ft);
  font-size:11px;
}
.wel-ct{font-size:15px}
.wel-cx{font-size:14px;line-height:1.45}
.wel-q{margin:27px 2px 11px;font-size:17px}
.profgrid{gap:10px;margin-bottom:17px}
.profopt{
  padding:16px 14px;
  border-radius:var(--radio-md) var(--radio-md) var(--radio-md) 7px;
  text-align:left;
  box-shadow:none;
}
.profopt.sel{border-color:var(--verde);background:var(--verde-bg);box-shadow:none}
.prof-e{font-size:14px;font-weight:800;letter-spacing:.08em;color:var(--verde-osc)}
.prof-t{font-size:15px}
.prof-x{font-size:13px;line-height:1.45}
.wel-foot{font-size:13px;line-height:1.45;margin-top:13px}
.wel-signature{margin-top:24px;padding-top:14px;border-top:1px solid var(--linea);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tenue)}

/* Controles y superficies */
.btn-primary,.cta,.diary-save,.sharebtn,.lux-use{
  min-height:50px;
  background:var(--ambar);
  background-image:none;
  color:#2F250C;
  border-radius:15px;
  box-shadow:none;
  font-size:15px;
  transition:transform .16s ease,filter .16s ease;
}
.diary-add button{background:var(--ambar);background-image:none;box-shadow:none;color:#2F250C}
.btn-primary:hover,.cta:hover,.diary-save:hover,.sharebtn:hover,.lux-use:hover{filter:brightness(.97);transform:translateY(-1px)}
.sharebtn{background:var(--terracota);color:#fff}
.card,.statuscard,.plant-card,.gtile,.calsec,.wx,.ptask,.luzcard,.diag-card{
  border-color:var(--linea);
  box-shadow:none;
}
.card{padding:18px;border-radius:20px;margin-top:12px}
.card h3{font-size:16px;line-height:1.35;margin-bottom:6px}
.tech-src{font-size:12px;line-height:1.5}
.plant-card{
  min-height:92px;
  margin-bottom:9px;
  padding:13px 14px 13px 17px;
  border-radius:20px;
}
.plant-card:hover,.gtile:hover{border-color:#B9C4BB;box-shadow:var(--sombra-sm)}
.thumb{width:66px;height:66px;border-radius:17px;background:#EDE2C8;background-image:none}
.ptask-thumb{background:#EDE2C8;background-image:none}
.pc-name{font-size:16px}
.pc-sci,.pc-x{font-size:13px}
.tag{font-size:12px;padding:4px 9px}
.grid-wrap{gap:10px}
.gtile{border-radius:19px;transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease}
.gtile:hover{transform:translateY(-2px)}
.gt-img{height:138px;background-image:none}
.gt-info{padding:11px 13px 13px}
.gt-name{font-size:15px}
.searchbar{
  min-height:50px;
  margin-bottom:12px;
  border-radius:16px;
  padding:0 14px;
  box-shadow:none;
}
.searchbar:focus-within{border-color:var(--verde);box-shadow:0 0 0 3px rgba(46,112,88,.1)}
.searchbar input{font-size:16px}
.filters{gap:7px;margin-bottom:14px}
.fchip{
  min-height:38px;
  padding:8px 12px;
  border-radius:12px;
  font-size:13px;
  box-shadow:none;
}
.fchip.on{border-color:var(--verde);background:var(--verde-bg);color:var(--verde-osc)}
.view-toggle{border-radius:13px;padding:3px}
.vbtn{width:36px;height:34px}
.field{margin-bottom:19px}
.field label{font-size:14px;margin-bottom:8px}
.field input,.field select{
  min-height:50px;
  border-radius:15px;
  padding:13px 14px;
  font-size:16px;
  outline:none;
}
.field input:focus,.field select:focus{border-color:var(--verde);box-shadow:0 0 0 3px rgba(46,112,88,.1)}
.hint,.opt-lbl{font-size:13px;line-height:1.45}
.opt,.locopt{
  min-height:48px;
  border-radius:14px;
  font-size:14px;
  box-shadow:none;
}
.opt.sel,.locopt.sel{border-color:var(--verde);background:var(--verde-bg);color:var(--verde-osc);box-shadow:none}
.plant-shell{max-width:980px;margin:0 auto}
.plant-intro{display:grid;grid-template-columns:minmax(220px,40%) 1fr;gap:22px;align-items:stretch;margin-top:8px}
.plant-summary{min-width:0;display:flex;flex-direction:column;justify-content:center;padding:8px 2px}
.hero:not(.photo){background:#E8D8AC!important;background-image:none!important}
.hero{height:242px;border-radius:var(--radio-lg) var(--radio-lg) var(--radio-lg) 9px;box-shadow:none;margin:0}
.hero .hero-ov{background:linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.22))}
.hero .badge{font-size:12px;padding:7px 11px;box-shadow:none}
.name-row{margin-top:0}
.pname{font-size:clamp(28px,4.4vw,42px);line-height:1.05;letter-spacing:-1.1px}
.psci{font-family:var(--font-botanical);font-size:17px;margin-top:7px;color:var(--tenue)}
.chip{font-size:13px;padding:8px 11px;box-shadow:none}
.plant-promise{max-width:560px;margin:16px 0 0;font-size:14px;line-height:1.55;color:var(--tierra-2)}
.ficha-nav{
  position:sticky;
  top:0;
  z-index:8;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
  margin:18px 0 12px;
  padding:5px;
  background:rgba(244,243,236,.96);
  border:1px solid var(--linea);
  border-radius:17px;
  backdrop-filter:blur(14px);
}
.ficha-nav button{min-height:42px;padding:7px 9px;border:0;border-radius:12px;background:transparent;color:var(--tenue);font-size:12px;font-weight:800;cursor:pointer}
.ficha-nav button.on{background:var(--brand-root);color:#fff}
.ficha-nav button:hover{background:var(--verde-bg);color:var(--verde-osc)}
.plant-section{scroll-margin-top:66px}
.plant-section-label{display:flex;align-items:center;gap:9px;margin:24px 2px 10px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--tenue)}
.plant-section-label::before{content:'';width:22px;height:2px;background:var(--brand-sun);border-radius:99px}
.statuscard{padding:16px;border-radius:19px}
.st-line{font-size:14px}
.st-grid>div{padding:11px;border-radius:13px}
.st-k{font-size:11px}
.st-v{font-size:14px}
.st-btns button{min-height:44px;border-radius:13px;font-size:13px}
.toolbar{gap:8px;margin:12px 0 4px}
.tbtn{min-height:62px;border-radius:15px;font-size:12px;box-shadow:none}
.tbtn .tb-e{font-size:18px}
.tbtn.share-action{background:var(--brand-earth);border-color:var(--brand-earth);color:#fff}
.tbtn.share-action .tb-e{filter:grayscale(1) brightness(4)}
.statuscard{border-left:4px solid var(--brand-sky)}
.statuscard .st-title{color:var(--tierra);font-size:15px}
.st-btns button:first-child{background:var(--brand-root);border-color:var(--brand-root);color:#fff}
.st-btns button.done{background:var(--verde-bg);border-color:var(--verde);color:var(--verde-osc)}
.care-rule{display:flex;align-items:flex-start;gap:10px;margin:0 0 12px;padding:12px 14px;border-radius:14px;background:#EEF3F1;color:var(--tierra-2);font-size:13px;line-height:1.45}
.care-rule strong{color:var(--tierra)}
.more-item{min-height:58px;border-radius:15px;font-size:14px;box-shadow:none}
.more-item span{font-size:12px}
.moon-hero,.growth,.reto{background:var(--tierra);background-image:none}
.growth{color:#fff;border-color:var(--tierra)}
.growth-big,.growth-sub{color:#fff}

/* Navegación inferior y acciones */
.nav{
  left:50%;
  right:auto;
  width:min(680px,calc(100% - 20px));
  transform:translateX(-50%);
  bottom:10px;
  padding:6px;
  padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));
  justify-content:stretch;
  gap:3px;
  background:rgba(255,255,255,.97);
  border:1px solid var(--linea);
  border-radius:20px;
  box-shadow:0 14px 40px rgba(24,62,52,.17);
  backdrop-filter:blur(18px);
}
.nav button{
  flex:1;
  min-width:0;
  min-height:54px;
  border:0;
  border-radius:15px;
  background:transparent;
  color:var(--tenue);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  font-family:var(--fb);
  font-size:11px;
  font-weight:800;
  cursor:pointer;
}
.nav button.on{background:var(--verde-bg);color:var(--verde-osc)}
.nav button.on::after{content:'';width:16px;height:2px;margin-top:1px;border-radius:99px;background:currentColor}
.nav button .ic{
  width:22px;
  height:22px;
  display:grid;
  place-items:center;
  line-height:1;
}
.nav button .ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on .ic{transform:none}
.fab{
  right:22px;
  bottom:84px;
  width:58px;
  height:58px;
  border-radius:18px;
  background:var(--terracota);
  background-image:none;
  box-shadow:0 14px 28px rgba(146,59,39,.28);
  font-family:var(--ft);
  font-size:29px;
}
.fab:hover{transform:translateY(-2px)}
.menu{
  top:66px;
  right:14px;
  width:min(340px,calc(100% - 28px));
  padding:7px;
  border-radius:18px;
  box-shadow:var(--sombra);
}
.menu button{min-height:46px;border-radius:12px;padding:11px 13px;font-size:14px;white-space:normal}
.menu button:hover{background:var(--verde-bg);color:var(--verde-osc)}
.toast{
  bottom:102px;
  max-width:calc(100% - 32px);
  padding:12px 16px;
  border-radius:14px;
  background:var(--tierra);
  font-size:14px;
}

/* Colección V3 */
.collection-shell{max-width:980px;margin:0 auto}
.collection-head{position:relative;overflow:hidden;margin:8px 0 14px;padding:22px 22px 20px;border-radius:var(--radio-lg) var(--radio-lg) var(--radio-lg) 9px;background:#fff;border:1px solid var(--linea)}
.collection-head::after{content:'';position:absolute;right:-52px;top:-72px;width:180px;height:180px;border:1px solid #D6E3DA;border-radius:50%;box-shadow:0 0 0 24px #F3F7F4,0 0 0 49px #FAFBF9}
.collection-kicker{position:relative;z-index:1;font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--verde)}
.collection-title-row{position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-top:10px}
.collection-title-row h2{margin:0;font-size:clamp(27px,4vw,38px);line-height:1.05;letter-spacing:-1px;color:var(--tierra)}
.collection-count{flex:0 0 auto;padding:7px 10px;border-radius:11px;background:var(--verde-bg);color:var(--verde-osc);font-size:12px;font-weight:800}
.collection-copy{position:relative;z-index:1;max-width:600px;margin:9px 0 0;color:var(--tenue);font-size:14px;line-height:1.5}
.collection-controls{margin-bottom:14px;padding:12px;background:#fff;border:1px solid var(--linea);border-radius:var(--radio-md)}
.collection-controls .searchbar{margin:0 0 10px}
.collection-controls .filters{margin:0}
.collection-view{display:flex;justify-content:flex-end;margin:0 0 9px}
.collection-shell .plant-card{background:#fff;border-left:0}
.collection-shell .plant-card::before{width:4px}
.collection-shell .pc-sci{font-family:var(--font-botanical);font-size:14px}
.pc-state{flex:0 0 auto;max-width:120px;padding:7px 9px;border-radius:11px;background:#EFF4F1;color:var(--verde-osc);font-size:11px;font-weight:800;line-height:1.25;text-align:center}
.pc-state.warn{background:#FFF0E9;color:var(--terracota-osc)}
.collection-shell .gt-info{display:flex;flex-direction:column;gap:5px}
.gt-state{font-size:12px;font-weight:800;color:var(--verde-osc)}
.gt-state.warn{color:var(--terracota-osc)}
.collection-empty{padding:36px 20px;background:#fff;border:1px dashed var(--linea-fuerte);border-radius:var(--radio-lg);text-align:center}
.collection-empty .empty-mark{width:52px;height:52px;margin:0 auto 13px;display:grid;place-items:center;border-radius:16px 16px 16px 5px;background:var(--verde-bg);color:var(--verde-osc);font-size:22px}
.collection-empty h3{margin:0;color:var(--tierra);font-size:19px}
.collection-empty p{max-width:380px;margin:7px auto 17px;color:var(--tenue);font-size:14px;line-height:1.5}
.collection-empty button{min-height:48px;padding:11px 18px;border:0;border-radius:14px;background:var(--tierra);color:#fff;font-weight:800;cursor:pointer}

/* Registro guiado V3 */
.add-shell{max-width:820px;margin:0 auto}
.add-head{margin:7px 0 15px;padding:18px 19px;border-radius:var(--radio-lg) var(--radio-lg) var(--radio-lg) 9px;background:var(--brand-root);color:#fff}
.add-kicker{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#CAE0D6}
.add-head h2{margin:9px 0 4px;font-size:clamp(25px,4vw,34px);line-height:1.08;letter-spacing:-.8px}
.add-head p{max-width:620px;margin:0;color:#D7E7E0;font-size:14px;line-height:1.5}
.add-progress{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:0 0 13px;padding:5px;background:#E7E8E1;border-radius:16px}
.add-step{position:relative;min-height:48px;display:flex;align-items:center;justify-content:center;gap:7px;padding:8px;border-radius:12px;color:var(--tenue);font-size:12px;font-weight:800}
.add-step span{width:22px;height:22px;display:grid;place-items:center;border:1px solid #BCC6BF;border-radius:8px;font-size:10px}
.add-step.on{background:#fff;color:var(--tierra);box-shadow:0 3px 10px rgba(22,61,52,.08)}
.add-step.on span{background:var(--brand-sun);border-color:var(--brand-sun);color:#2F250C}
.add-step.done{color:var(--verde-osc)}
.step-panel{padding:19px;background:#fff;border:1px solid var(--linea);border-radius:var(--radio-lg)}
.step-title{margin:0 0 5px;color:var(--tierra);font-size:20px;letter-spacing:-.35px}
.step-copy{margin:0 0 20px;color:var(--tenue);font-size:14px;line-height:1.5}
.catalogue-note{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-6px 0 12px;padding:10px 12px;border-radius:13px;background:var(--verde-bg);color:var(--verde-osc);font-size:12px;font-weight:700}
.catalogue-note b{font-size:13px}
.quick-searches{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0 13px}
.quick-searches button{min-height:36px;padding:7px 10px;border:1px solid var(--linea);border-radius:11px;background:#fff;color:var(--tierra-2);font-size:12px;font-weight:800;cursor:pointer}
.quick-searches button:hover{border-color:var(--verde);background:var(--verde-bg);color:var(--verde-osc)}
.identify-ai{margin:13px 0 17px;padding:14px;border:1px solid #C8D7D0;border-radius:16px;background:#F2F7F4}
.identify-ai-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.identify-ai-head strong{display:block;color:var(--tierra);font-size:14px}
.identify-ai-head span{display:block;margin-top:3px;color:var(--tenue);font-size:12px;line-height:1.4}
.ai-quota{flex:0 0 auto;padding:5px 8px;border-radius:9px;background:#fff;color:var(--verde-osc)!important;font-size:11px!important;font-weight:800}
.identify-ai-upload{min-height:46px;display:flex;align-items:center;justify-content:center;margin-top:11px;padding:10px 12px;border:1px solid var(--verde);border-radius:13px;background:var(--brand-root);color:#fff;font-size:13px;font-weight:800;cursor:pointer}
.identify-preview{height:150px;margin-top:11px;border-radius:14px;background:#DDE6E1 center/cover no-repeat}
.identify-result{margin-top:10px}
.identify-match{padding:12px;border:1px solid #BED5C6;border-radius:14px;background:#fff}
.identify-match-k{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--verde)}
.identify-match-n{margin-top:4px;color:var(--tierra);font-size:16px;font-weight:800}
.identify-match-s{font-family:var(--font-botanical);font-style:italic;color:var(--tenue);font-size:14px}
.identify-match button{width:100%;min-height:42px;margin-top:10px;border:0;border-radius:12px;background:var(--brand-sun);color:#30250A;font-size:12px;font-weight:800;cursor:pointer}
.identify-warning{padding:11px;border-radius:12px;background:#FFF0E9;color:var(--terracota-osc);font-size:12px;line-height:1.5}
.step-panel .field:last-child{margin-bottom:0}
.step-panel .results{max-height:320px;overflow:auto;border-radius:14px;scrollbar-width:thin}
.step-panel .res{min-height:58px;padding:10px 11px;border-radius:12px}
.res-main{min-width:0;flex:1}
.res-origin{display:inline-block;margin-top:4px;padding:2px 7px;border-radius:7px;background:var(--verde-bg);color:var(--verde-osc);font-size:10px;font-weight:800}
.chosen-origin{display:block;margin-top:3px;color:var(--verde-osc);font-size:11px;font-weight:800}
.form-actions{display:flex;align-items:center;gap:9px;margin-top:13px}
.form-actions .btn-primary{flex:1;margin:0}
.form-actions .btn-ghost{width:auto;min-width:108px;margin:0;padding:13px 16px}
.form-back{min-width:48px;height:50px;border:1px solid var(--linea);border-radius:14px;background:#fff;color:var(--tierra);font-size:20px;font-weight:800;cursor:pointer}
.form-cancel{display:block;width:100%;margin-top:10px;padding:9px;border:0;background:transparent;color:var(--tenue);font-size:13px;font-weight:700;cursor:pointer}
.step-summary{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:18px}
.step-summary>div{padding:12px;border:1px solid var(--linea);border-radius:14px;background:#FAFBF9}
.step-summary small{display:block;color:var(--tenue);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.step-summary strong{display:block;margin-top:4px;color:var(--tierra);font-size:14px}

/* Agenda V3 · primero decisiones, después calendario */
.agenda-shell{max-width:920px;margin:0 auto}
.agenda-head{margin:7px 0 13px;padding:20px;border-radius:var(--radio-lg) var(--radio-lg) var(--radio-lg) 9px;background:var(--brand-root);color:#fff}
.agenda-kicker{font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#C9DED5}
.agenda-head h2{margin:7px 0 5px;color:#fff;font-size:clamp(25px,4vw,34px);line-height:1.1;letter-spacing:-.75px}
.agenda-head p{max-width:650px;margin:0;color:#D5E5DE;font-size:14px;line-height:1.5}
.agenda-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:16px}
.agenda-stat{min-height:67px;padding:10px 11px;border:1px solid rgba(255,255,255,.16);border-radius:14px;background:rgba(255,255,255,.08)}
.agenda-stat strong{display:block;color:#fff;font-size:22px;line-height:1}
.agenda-stat span{display:block;margin-top:5px;color:#D4E5DE;font-size:11px;font-weight:750;line-height:1.25}
.agenda-stat.warn{background:rgba(231,178,63,.17);border-color:rgba(244,217,144,.35)}
.agenda-stat.warn strong{color:#F4D990}
.agenda-toolbar{display:flex;align-items:center;gap:8px;margin:0 0 13px}
.agenda-add{flex:1;min-height:48px;border:0;border-radius:14px;background:var(--brand-sun);color:#31270D;font-size:14px;font-weight:850;cursor:pointer}
.agenda-notif{min-width:48px;min-height:48px;padding:0 13px;border:1px solid var(--linea-fuerte);border-radius:14px;background:#fff;color:var(--tierra);font-size:13px;font-weight:800;cursor:pointer}
.agenda-notif.on{border-color:#BCD6C6;background:var(--verde-bg);color:var(--verde-osc)}
.reminder-form{margin:0 0 14px;padding:15px;border:1px solid #C8D7D0;border-radius:18px;background:#F2F7F4}
.reminder-form h3{margin:0 0 12px;color:var(--tierra);font-size:16px}
.reminder-form-grid{display:grid;grid-template-columns:1.35fr .8fr;gap:9px}
.reminder-form label{display:block;color:var(--tierra-2);font-size:12px;font-weight:800}
.reminder-form input,.reminder-form select{width:100%;min-height:45px;margin-top:5px;padding:9px 11px;border:1px solid var(--linea-fuerte);border-radius:12px;background:#fff;color:var(--texto);font-size:14px;outline:none}
.reminder-form-actions{display:flex;gap:8px;margin-top:10px}
