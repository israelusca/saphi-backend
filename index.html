.reminder-form-actions button{min-height:44px;padding:9px 13px;border-radius:12px;font-size:13px;font-weight:800;cursor:pointer}
.reminder-form-actions .save{flex:1;border:0;background:var(--tierra);color:#fff}
.reminder-form-actions .cancel{border:1px solid var(--linea);background:#fff;color:var(--tenue)}
.agenda-weather{display:flex;align-items:flex-start;gap:10px;margin:0 0 13px;padding:11px 12px;border:1px solid #C7D9EB;border-radius:14px;background:#EDF4FA;color:#2F5B8A;font-size:13px;line-height:1.45}
.agenda-weather b{display:block;color:#274F79}
.agenda-week{margin:0 0 14px;padding:11px;border:1px solid var(--linea);border-radius:18px;background:#fff}
.agenda-week .wknav{margin:0 0 9px}
.agenda-week .wk{margin:0}
.agenda-week .d{position:relative;min-height:71px;padding-bottom:7px}
.day-count{position:absolute;right:4px;top:4px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px;border-radius:999px;background:var(--tierra);color:#fff;font-size:9px;font-weight:850}
.agenda-day-title{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:18px 2px 9px}
.agenda-day-title h3{margin:0;color:var(--tierra);font-size:18px;letter-spacing:-.3px}
.agenda-day-title span{color:var(--tenue);font-size:12px;font-weight:750}
.agenda-section{margin-top:16px}
.agenda-section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 8px}
.agenda-section-head h3{margin:0;color:var(--tierra);font-size:14px}
.agenda-section-head span{color:var(--tenue);font-size:11px;font-weight:800}
.agenda-item{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:11px;align-items:center;margin-bottom:8px;padding:12px;border:1px solid var(--linea);border-radius:16px;background:#fff;box-shadow:var(--sombra-sm)}
.agenda-item.priority{border-color:#E8B9A8;background:#FFF9F6}
.agenda-item.review{border-color:#E7D5A4;background:#FFFCF3}
.agenda-item.done{opacity:.72;background:#F4F7F4;box-shadow:none}
.agenda-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:var(--verde-bg);font-size:18px}
.agenda-item.priority .agenda-icon{background:#FBE3D6}
.agenda-item.review .agenda-icon{background:#FBEFCD}
.agenda-copy{min-width:0}
.agenda-type{display:flex;align-items:center;gap:6px;margin-bottom:2px;color:var(--tenue);font-size:10px;font-weight:850;letter-spacing:.07em;text-transform:uppercase}
.agenda-name{color:var(--tierra);font-size:14px;font-weight:850;line-height:1.3}
.agenda-reason{margin-top:3px;color:var(--tenue);font-size:12px;line-height:1.4}
.agenda-action{min-height:39px;padding:8px 10px;border:1px solid var(--linea-fuerte);border-radius:11px;background:#fff;color:var(--tierra);font-size:11px;font-weight:850;cursor:pointer;white-space:nowrap}
.agenda-item.priority .agenda-action{border-color:var(--terracota);color:var(--terracota-osc)}
.agenda-item.done .agenda-action{border:0;background:var(--verde-bg);color:var(--verde-osc)}
.agenda-empty{padding:27px 18px;border:1px dashed var(--linea-fuerte);border-radius:18px;background:#FAFBF9;text-align:center}
.agenda-empty strong{display:block;color:var(--tierra);font-size:16px}
.agenda-empty p{max-width:430px;margin:5px auto 0;color:var(--tenue);font-size:13px;line-height:1.5}
.agenda-secondary{margin-top:18px}
.agenda-secondary .calsec{box-shadow:none}
.custom-delete{margin-left:6px;border:0;background:none;color:var(--tenue);font-size:11px;text-decoration:underline;cursor:pointer}
.mcell{position:relative}
.mcell .task-dot{position:absolute;right:5px;bottom:5px;width:7px;height:7px;border-radius:50%;background:var(--terracota)}
.delete-zone{margin-top:22px;padding:15px;border:1px solid #E7C7BC;border-radius:18px;background:#FFF9F6}
.delete-zone strong{display:block;color:var(--terracota-osc);font-size:14px}
.delete-zone p{margin:4px 0 11px;color:var(--tenue);font-size:12px;line-height:1.45}
.delete-zone button{width:100%;min-height:46px;border:1px solid #D99D89;border-radius:13px;background:#fff;color:var(--terracota-osc);font-size:13px;font-weight:850;cursor:pointer}
.confirm-layer{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:20px;background:rgba(17,42,35,.66);backdrop-filter:blur(5px)}
.confirm-dialog{width:min(430px,100%);padding:21px;border:1px solid rgba(255,255,255,.35);border-radius:24px;background:#fff;box-shadow:0 28px 80px rgba(10,28,23,.32)}
.confirm-mark{width:48px;height:48px;display:grid;place-items:center;margin-bottom:13px;border-radius:15px;background:#FBE3D6;font-size:21px}
.confirm-dialog h3{margin:0;color:var(--tierra);font-size:20px;line-height:1.25}
.confirm-dialog p{margin:8px 0 17px;color:var(--tenue);font-size:14px;line-height:1.55}
.confirm-name{display:block;margin-top:5px;color:var(--terracota-osc);font-weight:850}
.confirm-actions{display:grid;grid-template-columns:1.2fr 1fr;gap:8px}
.confirm-actions button{min-height:48px;border-radius:13px;font-size:13px;font-weight:850;cursor:pointer}
.confirm-cancel{border:0;background:var(--tierra);color:#fff}
.confirm-delete{border:1px solid #D99D89;background:#fff;color:var(--terracota-osc)}

/* Linaje y propagación */
.toolbar{grid-template-columns:repeat(5,minmax(0,1fr))}
.plant-card.child{width:calc(100% - 30px);margin-left:30px;border-left:3px solid var(--verde)}
.plant-card.child::after{content:'';position:absolute;left:-19px;top:29px;width:17px;height:1px;background:var(--linea-fuerte)}
.plant-card.child{overflow:visible}
.pc-lineage{display:flex;align-items:center;gap:5px;margin-top:5px;color:var(--verde-osc);font-size:11px;font-weight:800}
.pc-lineage::before{content:'↳';font-size:14px}
.prop-pill{display:inline-flex;align-items:center;gap:5px;margin-top:5px;padding:3px 8px;border-radius:999px;background:#EAF3EE;color:var(--verde-osc);font-size:10px;font-weight:850}
.lineage-card{margin:14px 0 0;padding:13px;border:1px solid #C9DDD1;border-radius:17px;background:var(--verde-bg)}
.lineage-card>div{display:flex;flex-direction:column;gap:2px}
.lineage-card small{color:var(--verde-osc);font-size:9px;font-weight:900;letter-spacing:.1em}
.lineage-card strong{color:var(--tierra);font-size:14px}
.lineage-card span{color:var(--tenue);font-size:11px}
.lineage-card>button{margin-top:9px;padding:8px 11px;border:1px solid #BFD6C8;border-radius:10px;background:#fff;color:var(--verde-osc);font-size:11px;font-weight:850;cursor:pointer}
.lineage-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lineage-head strong{color:var(--tierra);font-size:14px}
.lineage-head button{border:0;background:none;color:var(--verde-osc);font-size:12px;font-weight:850;cursor:pointer}
.lineage-children{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}

.prop-status-card{margin-top:14px;padding:15px;border:1px solid #BFD6C8;border-radius:19px;background:#F4F9F6}

.prop-status-top h3{margin:0;color:var(--tierra);font-size:16px}
.prop-status-top span{padding:4px 8px;border-radius:9px;background:#fff;color:var(--verde-osc);font-size:11px;font-weight:850}
.prop-status-top span.warn{background:#FFF1E8;color:var(--terracota-osc)}
.prop-status-card p{margin:6px 0 12px;color:var(--tenue);font-size:13px;line-height:1.5}
.prop-status-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prop-status-actions button{min-height:45px;border-radius:12px;font-size:12px;font-weight:850;cursor:pointer}
.prop-check{border:0;background:var(--tierra);color:#fff}
.prop-ready{border:1px solid var(--verde);background:#fff;color:var(--verde-osc)}
.prop-shell{max-width:760px;margin:0 auto}
.prop-head{margin:7px 0 14px;padding:20px;border-radius:var(--radio-lg) var(--radio-lg) var(--radio-lg) 9px;background:var(--brand-root);color:#fff}
.prop-head small{color:#C9DED5;font-size:11px;font-weight:850;letter-spacing:.12em;text-transform:uppercase}
.prop-head h2{margin:8px 0 5px;color:#fff;font-size:clamp(25px,4vw,33px);line-height:1.1}
.prop-head p{margin:0;color:#D5E5DE;font-size:14px;line-height:1.5}
.mother-strip{display:flex;align-items:center;gap:11px;margin-bottom:13px;padding:12px;border:1px solid var(--linea);border-radius:16px;background:#fff}
.mother-strip .ms-mark{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:var(--verde-bg);font-size:19px}
.mother-strip small{display:block;color:var(--tenue);font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.08em}
.mother-strip strong{display:block;color:var(--tierra);font-size:14px}
.method-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:9px 0 14px}
.method-card{min-height:88px;padding:12px;border:1px solid var(--linea);border-radius:15px;background:#fff;color:var(--tierra);text-align:left;cursor:pointer}
.method-card.sel{border-color:var(--verde);background:var(--verde-bg);box-shadow:0 4px 14px rgba(40,100,76,.12)}
.method-card b{display:block;margin-top:4px;font-size:13px}
.method-card span{display:block;margin-top:3px;color:var(--tenue);font-size:11px;line-height:1.35}
.prop-guide{margin:0 0 14px;padding:13px;border-left:4px solid var(--brand-sun);border-radius:5px 14px 14px 5px;background:#FFF9EA;color:var(--tierra-2);font-size:13px;line-height:1.5}
.prop-guide b{color:var(--tierra)}
.prop-node{display:flex;align-items:flex-start;gap:9px;margin:10px 0;padding:11px;border:1px solid #E8D5A0;border-radius:13px;background:#FFFDF6;color:var(--tierra-2);font-size:13px;line-height:1.4}
.prop-node input{width:20px;height:20px;flex:0 0 auto;accent-color:var(--verde)}

/* Herramientas según contexto */
.tools-shell{max-width:900px;margin:0 auto}
.tools-head{margin:7px 0 14px;padding:20px;border-radius:var(--radio-lg) var(--radio-lg) var(--radio-lg) 9px;background:var(--brand-root);color:#fff}
.tools-head small{color:#C9DED5;font-size:11px;font-weight:850;letter-spacing:.12em;text-transform:uppercase}
.tools-head h2{margin:7px 0 5px;color:#fff;font-size:clamp(25px,4vw,33px)}
.tools-head p{max-width:640px;margin:0;color:#D5E5DE;font-size:14px;line-height:1.5}
.tools-mode{display:flex;gap:6px;margin-top:14px;padding:4px;border-radius:14px;background:rgba(255,255,255,.1)}
.tools-mode button{flex:1;min-height:40px;border:0;border-radius:11px;background:transparent;color:#DDEAE4;font-size:12px;font-weight:850;cursor:pointer}
.tools-mode button.on{background:#fff;color:var(--tierra)}
.tool-intro{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tool-intro div{padding:12px;border:1px solid var(--linea);border-radius:14px;background:#fff}
.tool-intro b{display:block;color:var(--tierra);font-size:13px}
.tool-intro span{display:block;margin-top:3px;color:var(--tenue);font-size:11px;line-height:1.35}
.calc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.calc-grid .calsec{margin:0;box-shadow:none}
.calc-grid .calsec.wide{grid-column:1/-1}
.field-only{display:inline-flex;margin-left:6px;padding:2px 7px;border-radius:999px;background:#E7F0FB;color:#2F5B8A;font-size:9px;font-weight:850;vertical-align:middle}
